_codocs:
  id: keyboard-mode
  name: 키보드 모드
  parent:
    - 접근 모드
개요: |
  화면은 볼 수 있지만 마우스를 쓸 수 없는 사용자의 방식으로 E2E를 다시 실행한다. 묻는 질문은 "마우스 없이 같은 시나리오의 각 단계에 도달하고 실행할 수 있는가, 그 과정은 어떤가"이다.

  E2E가 지목한 목표 요소는 정답으로만 사용하고, 그 요소를 직접 포커스하거나 클릭하지 않는다. 실제 조작은 반드시 키보드 탐색을 거친다.
동작: |
  E2E의 `click()`을 만나면 현재 포커스에서 Tab / Shift+Tab 등 표준 키보드 조작으로 목표 요소를 찾아간 뒤 Enter 또는 Space로 실행한다.
  `fill()`을 만나면 입력 요소까지 탐색한 뒤 기존 값을 지우고 글자마다 실제 키를 눌러 입력한다(`keyboard.type`). 글자를 한 번에 넣으면(`insertText`, Playwright 원래 `fill`) 키 이벤트에 반응하는 앱이 동작하지 않는다. W3C APG 자동완성 예제는 글자마다 키를 눌러야 제안 목록이 열렸다(2026-11 실측). 2026-11 결정이다.
  `fill()` 대상별 입력 방법이다. 2026-11 결정이다.
  - 글자 입력(입력창, `textarea`, 숫자, `contenteditable`, 편집기): Ctrl+A로 전체 선택한 뒤 글자마다 키를 누른다. Quill과 TipTap에서도 편집기 내부 값까지 바뀌었다.
  - 날짜·시간(`date`, `time`, `datetime-local`, `month`, `week`): 접근성 트리에서 입력 안의 칸(`Year`, `Month`, `Day`, `AM/PM`, `Hours`, `Minutes`, `Week`) 순서와 포커스된 칸을 읽는다. 칸마다 포커스된 칸을 확인해 → 또는 ←로 맞추고 숫자를 넣으며, 오전/오후 칸은 ↑↓로 원하는 값이 될 때까지 바꾼다. 다섯 종류 모두 맞는 값이 들어갔고 22~69ms가 걸렸다. 칸마다 `change`가 일어나며 키보드 사용자도 같으므로 그대로 기록한다.
  - 페이지 언어로 칸 순서를 정하면 틀린다. 칸 순서는 브라우저 화면 언어를 따랐고, 칸이 다 차면 브라우저가 다음 칸으로 자동으로 넘어가 → 키가 한 칸을 건너뛰었다(2026-11 실측).
  - 범위 슬라이더(`range`): 목표 값이 될 때까지 방향키를 누른다.
  `setInputFiles()`(파일 업로드)를 만나면 파일 창을 여는 요소까지 키보드로 가서 Enter(안 되면 Space)를 누르고, Playwright의 `filechooser` 이벤트로 열린 파일 창에 E2E가 지정한 파일을 넣는다. 운영체제 창 없이 키보드 경로 그대로 시험할 수 있다. 2026-11 결정이다.
  - 확실한 경우: 입력 자체, 연결된 label, 입력을 감싼 요소에 도달하면 바로 실행한다.
  - 여는 버튼 추측: 그렇지 않으면 숨긴 입력과 가장 가까운 묶음 안의 포커스 요소를 후보로 삼아 한 회차에 하나씩 Enter를 눌러 본다. 판정은 다음 줄이 아니라 파일 창이 열렸는지로 한다. 틀리면 그 회차를 버리고 다음 후보로 처음부터 다시 실행한다([[키보드 모드:독립 실행]]).
  - 후보가 없거나 모두 실패하면 도달하지 못한 것으로 끝낸다. 어떤 요소로 열었는지와 다른 동작을 한 후보를 기록한다.
  - 2026-11 실측: 보이는 입력, 화면에서만 숨긴 입력, react-dropzone 방식(`div`가 입력을 감쌈)은 Tab으로 도달해 Enter로 파일 창이 열리고 파일이 들어갔다. `label`이 감싼 `hidden` 입력과 끌어 놓기만 되는 영역은 실제 키보드 사용자도 쓸 수 없어 도달하지 못했다. 옆 버튼이 숨긴 입력을 여는 방식은 HTML 관계가 없어 규칙 하나로는 찾지 못했고, 묶음 안 버튼이 하나인 규칙은 버튼이 둘이면 찾지 못하고 다른 동작을 하는 버튼을 누르는 경우가 있어 추측 단계로 정했다.
  색 선택(`<input type="color">`)은 Tab으로 도달하는지와 Enter로 색 선택 창이 열리는지까지 확인하고, 값은 원래 `fill`로 넣는다. 색 선택 창은 페이지 밖의 브라우저 고유 창이라 도구가 안을 읽거나 조작할 수 없기 때문이다. 키보드 경로가 막힌 것이 아니라 창이 페이지 밖에 있을 뿐이므로 대체 실행 금지 원칙과 부딪히지 않는다. `브라우저 색 선택 창: 값은 원래 방식으로 넣음`처럼 기록한다. 2026-11 결정이다.
  2026-11 실측(화면 없는 모드와 화면 있는 모드): Enter로 창이 열렸고 ↑로 색이 조금씩 바뀌었지만(`#336699` → `#34699d`), `ff0000`을 입력해도 원하는 값이 들어가지 않았다.
  `selectOption()`을 만나면 `<select>`까지 탐색한 뒤 Space로 목록을 열고, 목표 옵션까지 ↓ 또는 ↑를 누르고(비활성 옵션은 브라우저가 건너뜀) Enter로 정한다. 여러 개 선택(`multiple`)은 Ctrl+방향키로 이동하고 Ctrl+Space로 선택한다. 키가 정해진 동작이라 재실행하지 않는다. 2026-11 결정이다.
  탐색 전에 목표가 보이고 활성화될 때까지 기다린다. 기다리지 않으면 아직 없거나 비활성인 요소를 Tab이 건너뛰어 틀린 "도달 못 함"이 된다. 2026-11 결정이다.
  - 방법: `locator.waitFor({ state: 'visible' })` 뒤 `isEnabled()`를 50ms마다 확인한다. 둘 다 공개 API이고 마우스와 스크롤을 쓰지 않는다. `isEnabled`는 `disabled`와 `aria-disabled`를 모두 비활성으로 본다.
  - `click({ trial: true })`는 쓰지 않는다. 기다리는 동안 `pointerover`가 일어나고 화면을 스크롤해서, hover 메뉴나 툴팁처럼 키보드 사용자에게 없는 화면을 만든다(2026-11 실측).
  - Playwright가 확인하는 조건 중 "움직임이 멈춤"과 "다른 요소에 가려지지 않음"은 마우스 클릭 위치를 위한 것이라 확인하지 않는다. 로딩 덮개가 버튼을 덮어도 키보드는 그 버튼에 갈 수 있으므로 그대로 기록한다.
  - 시간 초과는 Playwright 순서를 따른다. 그 줄의 `timeout` 옵션, 없으면 설정의 `actionTimeout`(`testInfo.project.use.actionTimeout`), 둘 다 없으면 따로 끊지 않고 테스트 제한 시간에 맡긴다. 끝까지 준비되지 않으면 원래 Playwright와 같은 시간 초과 실패로 남기며, 접근성 관찰 결과가 아니다.
  - 2026-11 실측: `actionTimeout: 1500`에서 원래 `click()`은 1,514ms, `click({ timeout: 700 })`은 714ms, `waitFor`는 설정값을 그대로 따라 1,500ms에 포기했다. `actionTimeout`이 없으면 원래 `click()`은 테스트 제한 시간에 걸렸다. 늦게 나타나는 버튼은 812ms, 입력 뒤 켜지는 버튼은 613ms 기다린 뒤 진행했고 마우스 이벤트는 없었다.
  - 한계: 테스트 안에서 `page.setDefaultTimeout()`으로 바꾼 값은 `waitFor`만 따르고, 활성화 확인은 설정 파일 값을 쓴다. 바뀐 값을 읽는 공개 API가 없다.
  링크는 Enter로 실행한다(역할 관례). 페이지가 바뀌어도 다음 단계는 따로 처리하지 않고 실제 Tab으로 탐색한다. 단계 기록에 `navigation`(`load`는 새로 불러옴, `same-document`는 SPA 주소 변경)과 `focusLost`(이전에 포커스된 요소가 문서에서 사라져 포커스가 body로 떨어짐)를 남긴다. 2026-11 결정이다.
  2026-11 실측: 일반 이동은 body에서 시작해 메뉴를 다시 지났다(Tab 4). SPA가 내용만 바꾸고 포커스를 관리하지 않으면 포커스는 body인데 Tab 한 번에 새 내용의 버튼으로 갔다. Chromium이 사라진 요소의 자리를 다음 Tab의 시작점으로 기억하기 때문이며, 이 시작점은 JavaScript로 읽을 수 없어 지나간 지점 목록으로 보여 준다. 포커스가 사라지는 것은 스크린 리더 사용자가 화면 변화를 놓치는 흔한 문제라 사실로 남긴다.
  라디오(`check()`나 `click()`이 라디오를 가리킬 때)는 Tab으로 그룹에 들어간 뒤 목표 쪽 방향키로 간다([[키보드 모드:탐색 경로]]). 방향키로 도착하면 이미 선택되므로 추가 키를 누르지 않고, Tab으로 들어간 곳이 목표인데 선택되지 않았으면 Space를 누른다. 키가 정해진 동작이라 재실행하지 않는다. 2026-11 결정이다.
  키보드로는 중간 항목을 선택하지 않고 지나갈 수 없다. ↓가 이동과 동시에 선택해 `change`가 일어난다(네이티브와 `role="radiogroup"` 모두, 2026-11 실측). 실제 키보드 사용자도 같으므로 막지 않고 `지나가며 선택됨: 빠른`처럼 기록한다. 그룹 안에서 Tab은 그룹 밖으로 나가고, 비활성 항목은 건너뛰며, 첫 항목의 ↑는 마지막으로 넘어간다.
  닫힌 채로 ↓를 누르면 지나가는 옵션마다 `change`가 일어나(1명→5명에서 3번) 변경할 때마다 동작하는 앱에서 중간 옵션의 효과가 생긴다. 목록을 열고 고르면 `change`가 한 번이라 원래 `selectOption`과 같다(2026-11 실측, Chromium). Playwright의 `selectOption`은 `<select>`에서만 동작하므로 직접 만든 드롭다운은 클릭과 위젯 방향키 규칙을 따른다.

  예약 변경 E2E의 한 단계 기록 예시:
  [step 2] getByRole("button", { name: "예약 변경" }).click()
  시작 포커스: body (페이지 진입 직후) → Tab × 10 (link "메인으로 건너뛰기", link "홈", …, button 이름 없음, button "예약 변경" 도달) → Enter → 대화상자 열림, 포커스가 "변경 날짜" 입력으로 이동
관찰 항목: |
  - 단계 시작 시 포커스 위치
  - 사용한 키와 횟수, 정지 지점 순서
  - 목표 도달 여부, 포커스 순환(한 바퀴) 감지
  - 실행에 쓴 키와 실행 결과(이벤트가 키보드 활성화로 발생했는지 포함)
  - 실행 후 포커스 이동

  각 정지 지점에서 무엇이 전달되는지는 [[비시각 정보 모드]]가 같은 경로 위에 덧붙인다.
설계 고려 사항: |
  정하지 않았지만 다뤄야 할 사항이다.
  - `fill()` 방식: 기존 값 지우기와 입력을 select, contenteditable, 날짜 입력에서 따로 확인해야 한다.

  덤으로 얻을 수 있는 관찰: 포커스 표시가 보이는지(포커스 전후 outline 등 계산 스타일 비교), 모달이 열릴 때 포커스가 안으로 이동하는지, 양수 tabindex 사용.
실현 근거: |
  2026-10 Playwright 1.64.1, Chromium에서 실측으로 확인했다. 가로채기 메커니즘은 [[Playwright 가로채기]]에 정리한다.
  - getByRole, 체이닝된 locator, first/nth/filter, frameLocator(iframe), shadow DOM 대상 모두 키보드 탐색 후 실행되었고, click 이벤트가 키보드 활성화(detail=0)로 발생했다.
  - 포커스 판정은 `el.getRootNode().activeElement === el`과 문서 포커스 여부로 iframe·shadow DOM에서도 동작했다.
  - `tabindex=-1` 버튼은 Tab 21회 탐색 후 미도달로 기록되었다.
실행 키 선택: |
  E2E가 더블클릭, 우클릭, hover 같은 포인터 동작을 지시해도 도구가 키를 단정하지 않는다. 다음 순서로 키를 고르고 어디서 알았는지 기록한다.
  1. 앱이 선언한 키: `aria-keyshortcuts`. Chromium 접근성 트리에 `keyshortcuts`로 노출되어 읽고 그대로 누를 수 있다.
  2. 역할 관례: 선언이 없으면 요소 역할에 맞는 키. 예: option은 Enter, 하위 메뉴가 있는 menuitem은 ArrowRight, button은 Enter·Space, checkbox는 Space.
  3. 일반 후보: Enter, Space.

  `aria-describedby` 같은 문장 안내는 텍스트로 기록한다. AI로 해석하지 않으며, 정규식으로 키 단어만 뽑아 쓸지는 정하지 않았다([[열린 질문]]).
  선언은 동작을 구현해 주지 않으므로 선언된 키도 눌러서 다음 단계가 이어지는지 확인한다. 선언과 실제가 다르면 그 사실이 기록에 드러난다.
  `dragTo`처럼 키 관례가 없는 동작은 그 단계에서 실행을 끝내고 그 사실을 기록한다([[관찰과 판단의 분리:도달하지 못한 경우]]). `page.mouse` 좌표 동작은 다음과 같이 처리한다. 2026-11 결정이다.
  - 좌표 아래 요소를 찾는다. 같은 프로세스의 iframe 안까지 좌표를 옮겨 따라 들어가고, 그 요소나 가장 가까운 포커스 가능한 조상을 목표로 본다. 목표는 E2E가 지목한 것이 아니라 도구가 추정한 것이므로 `좌표 (20, 20) → button "저장" (좌표로 추정)`처럼 기록한다.
  - `click(x, y)`는 `click()`, `dblclick(x, y)`는 `dblclick()`, `move(x, y)`만 있으면 `hover()`와 같은 규칙으로 실행한다.
  - `down` → `move` → `up`은 끌기로 보고 `dragTo()`처럼 그 단계에서 끝낸다. 움직임 없는 `down` → `up`은 클릭으로 본다.
  - `wheel`은 목표가 없는 스크롤이라 원래대로 실행하고 기록만 남긴다.
  - 포커스 가능한 대상이 없으면(canvas, 클릭만 붙은 `div`) 도달하지 못한 것으로 끝낸다.
  - `dblclick`은 안에서 `click`을 다시 부르므로 한 번만 처리하도록 가드한다.
  - 2026-11 실측: `click`, `dblclick`, `move`, `down`, `up`, `wheel`이 모두 `Mouse.prototype`에서 잡혔고 Locator의 `click()`은 여기로 오지 않았다. 버튼 안 글자는 감싼 버튼, iframe 안 버튼은 그 버튼으로 찾았고 canvas와 카드의 빈 곳은 대상이 없었다.
다음 단계 확인: |
  키보드 시도 직후에는 판단을 보류하고, E2E의 다음 단계가 올 때 그 목표나 assertion을 짧은 시간 동안 확인한다.
  이어지면 그 키로 진행한다. 이어지지 않으면 그 회차를 버리고 다음 후보 키로 테스트를 처음부터 다시 실행한다([[키보드 모드:독립 실행]]). Escape로 되돌리지 않는다.
  다음 단계가 없으면 `no-next-step`으로 기록한다.

  실측 한계:
  - `toBeHidden`처럼 원래부터 참인 단계는 잘못된 키여도 통과한다.
  - 다음 단계가 앞 단계와 무관하면 아무것도 확인하지 못한다.
  - 실패한 시도마다 확인 대기 시간(검증에서 1초)이 든다.
탐색 종료: |
  처음 멈췄던 지점으로 돌아오면 한 바퀴로 보고 멈춘다. 끝이 없는 페이지를 위해 Tab 상한도 둔다. 기본값은 50이고 `a11yProjects({ maxTabs: 100 })`처럼 사용자가 바꿀 수 있다. 2026-11 결정이다.
  멈춘 이유는 `round`(한 바퀴), `limit`(상한)로 구분해 남긴다. `limit`은 더 뒤에 있을 수 있다는 뜻이다.
  모달 안에서만 순환하는 포커스 트랩도 같은 규칙으로 멈춘다. 50은 측정값이 아니므로 블로그 E2E를 재고 조정한다.
건너뛰기 링크: |
  탐색 경로에서는 건너뛰기 링크를 누르지 않는다. 목표가 건너뛰는 구간에 있으면 지나치게 되고, 단계마다 Tab 수의 뜻이 달라지기 때문이다. F6이나 위젯 밖으로 나가는 Shift+Tab 같은 다른 블록 이동도 쓰지 않는다.

  링크가 실제로 동작하는지는 URL마다 한 번 따로 확인한다. 2026-11 결정이다.
  - 찾기: 링크 이름은 보지 않고 구조로 찾는다. 본문(`main`, 없으면 첫 `h1`) 앞에 있는 같은 페이지 앵커(`#...`) 링크가 모두 후보다. 첫 Tab 지점이 아니어도 된다.
  - 확인: 후보마다 Enter 뒤 Tab의 첫 지점과 주소 변경을 기록한다. 하나를 고르지 않는다. 국내 사이트처럼 건너뛰기 링크가 여러 개면 모두 결과가 남는다.
  - 기본 경로: 테스트 context의 쿠키와 localStorage를 `storageState`로, sessionStorage는 `addInitScript`로 복사한 별도 context에서 같은 URL을 연다. 같은 context의 새 탭은 `page` 이벤트와 `context.pages()`로 테스트에 보이므로 쓰지 않는다.
  - 대체 경로: 별도 context가 다른 주소로 이동하면 테스트가 끝난 뒤 context를 닫기 직전에 실제 페이지에서 확인한다. 이때는 테스트가 끝났으므로 페이지를 건드려도 된다. 이동 원인은 메모리 로그인, 앞 단계 상태, 일회용 주소, 세션 판단, 자동화 차단 등 여러 가지라 도구는 원인을 적지 않는다. 확인하지 못한 페이지는 `별도 세션에서 열자 /login으로 이동`처럼 이동한 주소만 남기고, Tab 경로에 링크가 지나갔다면 링크가 있다는 사실은 그대로 남는다.
  - 숨김: 확인 호출은 Playwright 내부 호출(`_wrapApiCall`의 `internal`)로 감싸 리포트 step과 trace에 남기지 않는다.
  - 중복: 같은 URL은 워커 안에서 한 번만 확인하고 결과를 재사용한다.
  - 기록: 후보별 `name`, `href`, 첫 지점, 주소 변경과 확인 경로(`context` / `live`). 예: `Tab 22 · 건너뛰기 링크 사용 시 Tab 2`. 링크가 본문으로 보내지 않으면 첫 지점이 그대로 드러난다.

  2026-11 실측:
  - 실제 사이트 14곳: GitHub, MDN, W3C, GOV.UK, BBC, 한국어 위키백과, 대한민국 정책브리핑, 서울시, Daum에서 찾았다. 위키백과 "본문으로 이동"은 이름 조건이었다면 놓쳤고, GOV.UK는 쿠키 배너 뒤 4번째, BBC는 2번째 Tab 지점에 있었다. Daum은 바로가기 10개가 있어 하나를 고르는 규칙이 틀렸고, 그래서 모두 확인하는 방식으로 바꿨다. Apple, React, NAVER, velog는 후보가 없었다. 정부24는 자동화 차단 화면으로 이동해 확인하지 않았다.
  - Playwright 테스트 러너: 이름 없는 링크, 링크 둘, 없는 앵커, 쿠키 배너 뒤, 메모리 로그인(대체 경로), 팝업을 기다리는 테스트가 모두 기대대로였다. 팝업 테스트와 `context.pages()` 검사는 그대로 통과했고 trace에는 패키지 fixture 외의 호출이 남지 않았다.
  - 블로그 E2E 41개: 원래 프로젝트와 a11y 프로젝트가 모두 통과했다. 블로그에는 건너뛰기 링크가 없어 5개 URL이 후보 없음으로 기록되었다. 중복 제거 후 테스트 시간 합은 47.1초 대 47.4초였다.

  남는 경우: 별도 context에서 열 수 없는 페이지 중 테스트의 마지막 페이지가 아닌 곳은 대체 경로로도 닿지 않아 확인하지 않았다는 사실을 남긴다. 자동화를 막는 사이트는 확인하지 않는다. `<button>`으로 만든 건너뛰기는 드물어 찾지 않는다. 어느 경우든 영향을 받는 것은 이 확인뿐이고 E2E 실행은 그대로다.
도달 기준: |
  E2E가 지목한 요소와 실제 포커스를 받는 요소는 다를 수 있다. 다음 경우를 도달로 인정하고 관계를 `reachedBy`에 남긴다. 2026-11 결정이다.
  - `self`: 포커스가 목표 자체다.
  - `ancestor`: 목표가 포커스를 받을 수 없고 포커스가 목표를 감싼다. 예: `<button><span>저장</span></button>`의 글자를 지목.
  - `label`: 목표가 속한 label의 입력에 포커스가 갔다.
  - `descendant`: 목표 안의 포커스 요소가 하나뿐이고 거기에 포커스가 갔다. 예: `<div><input></div>`의 div를 지목.

  목표 안에 포커스 요소가 여러 개면 인정하지 않는다. 카드 안의 "보기"와 "삭제"처럼 어느 쪽이 맞는지 근거가 없고, 도구가 하나를 골라 누르면 E2E가 의도한 동작이 아니기 때문이다. 탐색을 계속하고 끝까지 없으면 도달하지 못한 것으로 끝낸다.

  목표가 스스로 포커스를 받을 수 있으면 감싸는 요소를 `ancestor`로 인정하지 않는다. `tabindex`가 있는 스크롤 영역이 안쪽 버튼을 감쌀 때 영역에서 멈추지 않기 위해서다.

  2026-11 실측: 직접 만든 검증 페이지의 같은 요소, 버튼 안 글자, label 감싸기, `label for`, 안에 입력 하나, 링크 둘인 카드, 스크롤 영역 안 버튼, `tabindex` 영역 안 글자가 모두 위 규칙대로 판정되었다. Tab 탐색 관계 판정만 확인했고 실제 키 실행까지 잇지는 않았다.
독립 실행: |
  잘못 추측한 키의 영향이 다음 시도와 기록에 섞이지 않도록 키 시도를 서로 독립시킨다. 2026-11 결정이다.

  추측 단계는 누를 키가 하나로 정해지지 않아 후보를 눌러 봐야 하는 단계다. E2E 명령 이름이 아니라 대상 요소로 나뉜다.
  - 추측이 아님: `<button>`·`<a href>`의 click(Enter), 체크박스 check(Space), fill, E2E가 키를 지정한 press, 선언된 키.
  - 추측임: 안내 없는 dblclick·우클릭·hover, `<div role="button">`처럼 직접 만든 요소의 click, 선언된 키가 동작하지 않는 경우.
  - 시도할 키가 없음: `dragTo`처럼 키 관례가 없는 동작은 그 단계에서 실행을 끝낸다.

  실행 구조:
  - 첫 실행이 본 실행을 겸한다. 테스트에 추측 단계가 있는지는 실행해 봐야 알 수 있어서, 시도를 별도 실행으로 두면 모든 테스트가 두 번 돈다.
  - 키가 다음 단계로 이어지면 그대로 끝까지 진행한다. 재실행하지 않는다.
  - 이어지지 않으면 그 회차를 버리고 다음 키로 처음부터 다시 실행한다. 재실행은 키가 틀렸을 때만 생긴다.
  - 버린 회차의 키와 결과는 `attempts`에 남긴다.
  - 후보를 다 써도 이어지지 않으면 그 단계에서 실행을 끝내고 실패로 남긴다([[관찰과 판단의 분리:도달하지 못한 경우]]). 대체 실행은 하지 않는다.
  - 앞 단계의 키가 정해지면 다음 회차는 그 키를 쓰고 넘어간다.

  도달과 실행을 나눈다. Tab 이동은 대체로 상태를 바꾸지 않으므로 이동 경로는 한 회차에서만 기록하고, 재실행은 실행 키 때문에만 생긴다. 다만 라디오의 방향키나 포커스 이탈 시 자동 저장처럼 이동이 상태를 바꿀 수 있으므로, 방향키는 목표가 든 복합 위젯 안에서만 쓰고([[키보드 모드:탐색 경로]]) 이동 중의 화면 변화와 요청을 기록한다.

  Escape로 되돌리는 방식은 쓰지 않는다. 앱이 Esc 닫기를 구현하지 않았으면 메뉴가 열린 채 다음 키가 메뉴에 들어가 우연히 다음 단계를 통과할 수 있고, 그러면 틀린 기록이 드러나지 않는다.

  한계: 서버에 남는 일은 재실행으로 되돌아가지 않는다. 삭제는 테스트의 데이터 초기화가 있어야 복구되고, 메일이나 주문 요청은 회차 수만큼 나갈 수 있다. 시작 지점 복원은 불가능하다. Playwright는 메모리 상태를 저장하지 못하고 테스트 함수는 중간부터 시작할 수 없어서 항상 처음부터 다시 실행한다.

  구현 방법은 [[열린 질문:재실행 구현]]에 있다.
재실행 방식: |
  [[키보드 모드:독립 실행]]의 재실행은 Playwright 재시도로 한다. 2026-11 결정이다.

  키가 틀리면 도구가 그 회차를 실패시켜 재시도를 일으킨다. 이 테스트는 `flaky`로 표시되고 터미널에 버린 회차의 메시지가 찍힌다. 실패를 발생시켜야만 재실행되므로 이 표시는 받아들인다.
  - 재시도 설정은 a11y 프로젝트에만 둔다. 원래 E2E 프로젝트의 결과는 바뀌지 않는다.
  - 메시지는 `a11y: Enter 다음 단계 안 됨, 처음부터 다시 실행`처럼 사실만 적는다. 테스트가 자체적으로 불안정해서 생긴 `flaky`와는 이 접두어로 구분한다.
  - 진짜 실패는 재시도 횟수만큼 돌고 실패로 남는다. 이 재시도를 skip으로 생략하면 실패가 `flaky`로 가려지므로 생략하지 않는다.

  실측 비교와 남은 확인 사항은 [[열린 질문:재실행 구현]]에 있다.
재실행 전제: |
  첫 버전은 두 번 실행해도 안전한 E2E를 전제로 한다. 서버를 바꾸는 E2E는 이미 초기화, 전용 데이터베이스, 가짜 API, 고유 데이터로 대비하는 경우가 많아 새 부담을 주지 않는다. E2E를 고치라고 요구하지 않고 이 전제만 문서에 적는다. 2026-11 결정이다.

  추측 키가 보낸 서버 변경 요청은 막지 않고 `attempts[].requests`에 기록만 한다. 요청 차단은 정답 키도 막을 수 있어 명확한 필요가 생기기 전에는 만들지 않는다.

  전제가 깨져 재실행이 진행되지 못해도 도구는 상태를 정하지 않는다. 테스트는 일어난 결과 그대로 실패로 남고, 이전 회차의 사실을 힌트로 덧붙인다.
  - 힌트 조건: 이전 회차의 틀린 키 뒤에 서버 변경 요청이 있었고, 이번 회차가 그 추측 단계나 그 앞에서 실패한 경우.
  - 힌트 예: `a11y 힌트: 이전 회차의 Enter 뒤 POST /api/delete가 있었고, 이번 회차에서 대상 요소를 찾지 못함`
  - 힌트는 시간 순서만 적는다. 키가 그 요청을 일으켰다고 단정하지 않고, 원인은 개발자가 판단한다.
  - 상관없는 요청이 우연히 앞서도 결과는 바뀌지 않으므로 진짜 실패가 가려지지 않는다. 힌트가 틀려도 참고 정보가 틀릴 뿐이다.

  2026-11 실측: 요청 수집, 회차 간 기록 전달, 대상 요소와 앞 단계 실패 감지는 동작했고, 실패한 테스트에 annotation을 다는 것도 가능했다. 이 문구를 실패 결과와 함께 출력하는 조합 자체는 시험하지 않았다.
탐색 경로: |
  목표까지 정해 둔 규칙으로 한 경로만 가 보고 그대로 기록한다. 2026-11 결정이다.
  1. 현재 포커스에서 Tab으로 앞으로 간다.
  2. 목표에 닿으면 끝난다.
  3. 목표가 들어 있는 복합 위젯에 들어오면 그 안에서는 방향키로 간다.
  4. 한 바퀴를 돌아도 못 찾으면 도달하지 못한 것으로 끝난다([[관찰과 판단의 분리:도달하지 못한 경우]]).

  방향키는 위젯 role로 고른다. `tablist`·`menubar`·`toolbar`는 좌우, `menu`·`listbox`·`tree`는 상하, `radiogroup`과 `grid`는 네 방향이고, `aria-orientation`이 있으면 그 값을 먼저 따른다. 위젯 안의 항목 순서는 DOM으로 알 수 있어 목표 쪽으로 누른다. 끝에서 처음으로 넘어가는 동작은 위젯마다 달라 세지 않는다.

  횟수는 실제로 누른 횟수다. 기록은 `Tab 3, 방향키 1`처럼 적고 최적 경로라고 부르지 않는다. 진짜 최소 경로를 알려면 키 조합을 모두 눌러 봐야 하고 그 과정에서 화면이 바뀔 수 있다. Shift+Tab, 건너뛰기 링크, 앱 전용 단축키로 더 짧게 갈 수 있어도 이 기록은 그 사실을 모른다.

  포커스가 입력에 남는 `aria-activedescendant` 위젯은 그 값이 가리키는 요소를 현재 위치로 본다.

  자동완성: 지금 포커스된 요소가 가리키는 목록(`aria-controls`, `aria-owns`) 안에 목표가 있으면 그 목록을 위젯으로 보고 ↓/↑로 간다. 포커스가 목표에 있거나 `aria-activedescendant`가 목표를 가리키면 도달이고, 옵션의 역할 관례대로 Enter로 실행한다. 역할 없이 `div`로 만든 제안 목록은 도달하지 못한 것으로 끝난다. 2026-11 결정이다.
  2026-11 실측: `aria-activedescendant` 방식과 포커스가 옵션으로 옮겨 가는 방식은 ↓ 3번으로 도달해 값이 들어갔고, W3C APG 자동완성 예제도 ↓ 4번으로 도달했다. `div` 제안 목록은 도달하지 못했다.

  iframe과 shadow DOM: Tab은 브라우저가 프레임 안팎으로 옮기고, 도달 확인은 Playwright가 목표가 있는 프레임 안에서 한다(열린 shadow DOM 포함). 지점의 역할·이름은 포커스가 있는 프레임을 찾아 그 안의 포커스된 요소만 읽는다(지점당 1~2ms). 결과가 `generic`처럼 포커스를 받을 수 없는 역할이면 닫힌 shadow DOM일 수 있으므로 그 프레임의 접근성 트리 전체(`Accessibility.getFullAXTree`, `frameId`)에서 포커스된 노드를 찾는다. iframe 안 지점에는 프레임을 남긴다(예: `iframe "결제 위젯"`). 닫힌 shadow DOM 안의 요소는 Playwright로 지목할 수 없어 목표가 되지 않고 지나가는 지점으로만 나온다. 2026-11 결정이다.
  2026-11 실측: 같은 출처·다른 출처 iframe과 열린·닫힌 shadow DOM을 Tab으로 모두 지났다. Playwright의 Chromium은 다른 출처 iframe도 페이지와 같은 CDP 연결로 다뤘고, 프레임별 연결을 따로 만들면 오류가 났다. 포커스된 요소만 읽으면 닫힌 shadow DOM 버튼이 `generic`으로 나왔고 트리 전체를 읽으면 이름까지 나왔다. 트리 전체 비용은 위키백과 25ms, GitHub 30ms, MDN 116ms(노드 7,147개)였다.

  규칙 밖의 경우는 키를 추정하지 않고 시도 범위를 기록한다. role 없는 직접 만든 위젯, 가상 스크롤 목록이 여기에 해당한다.

  2026-11 실측: 직접 만든 검증 페이지에서 탭 양방향, 메뉴, 라디오, 세로 툴바, 그리드, `aria-activedescendant` 목록, 일반 버튼이 모두 도달했다. role 없는 위젯은 Tab 한 바퀴 뒤 도달하지 못한 것으로 끝났다. 실제 UI 라이브러리와 블로그 E2E는 확인하지 않았다.
