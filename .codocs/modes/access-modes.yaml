_codocs:
  id: access-modes
  name: 접근 모드
  parent:
    - Journey A11y
개요: |
  이 문서는 기존 E2E를 어떤 접근 방식으로 다시 실행하는지, 모드 사이의 관계와 첫 버전 범위를 설명한다.
  모드는 장애 유형이 아니라 웹사이트에 접근하는 방식을 기준으로 나눈다. 같은 E2E 단계를 서로 다른 감각으로 관찰하는 것이다.

  - [[키보드 모드]]: 화면은 보이지만 마우스를 쓸 수 없는 사용자. "갈 수 있고, 누를 수 있는가?"
  - [[비시각 정보 모드]]: 화면을 보지 않고 보조기술이 전달하는 정보에 의존하는 사용자. "무엇인지, 지금 어디인지, 무슨 일이 일어났는지 알 수 있는가?"
  - [[스크린 리더 모드]]: 실제 NVDA, VoiceOver 등을 쓰는 사용자. "그 정보가 실제로 어떻게 들리는가?"
모드 사이의 관계: |
  세 모드는 계층을 이룬다.
  - 키보드: 갈 수 있나, 누를 수 있나
  - 비시각 정보: 키보드로 다니면서, 무엇인지와 무슨 일이 일어났는지 알 수 있나
  - 실제 스크린 리더: 그 정보가 실제로 어떻게 들리나

  스크린 리더 사용자도 대부분 키보드로 조작하므로 키보드 모드가 나머지의 기반이다.

  키보드와 비시각 정보는 서로 다른 것을 드러낸다. 한쪽에서 문제없는 것이 다른 쪽에서 막히는 경우가 흔하다.
  - 이름 없는 아이콘 버튼: 키보드로는 도달·실행되고 그림도 보이지만, 비시각 정보로는 이름 없는 button이다.
  - tabindex 없는 `div role="button"`: 비시각 정보로는 버튼으로 노출되지만 키보드로 도달하지 못한다.
  - 화면에만 표시되는 결과 메시지: 키보드 사용자는 보지만, 포커스 이동이나 live region이 없으면 비시각 사용자에게 전달되지 않는다.

  비시각 정보 모드와 실제 스크린 리더 모드는 같지 않다. 브라우저의 접근성 트리는 스크린 리더가 읽을 재료이고, 스크린 리더는 이를 OS 접근성 API로 받아 자체 방식으로 다시 가공한다. 그래서 같은 트리도 스크린 리더마다 다르게 읽힌다.
첫 버전 범위: |
  첫 버전은 키보드와 비시각 정보만 지원한다. 두 모드는 한 번의 실행에서 한 벌의 기록으로 남긴다([[기록과 리포트:실행 단위]]).
  실제 스크린 리더는 첫 버전에서 제외하고 다음 버전에서 다룬다. 환경 구성과 설계 부담이 커서 설정 0 원칙([[Journey A11y:제품 원칙]])과 충돌하기 때문이다.

  스크린 리더는 제품의 지향점으로 유지한다. 기록의 한 단계 안에 `screenReader` 칸을 추가할 수 있게 설계해, 나중에 기존 필드를 바꾸지 않는 것을 목표로 한다.
