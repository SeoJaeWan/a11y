_codocs:
  id: screen-reader-mode
  name: 스크린 리더 모드
  parent:
    - 접근 모드
개요: |
  실제 스크린 리더(NVDA, VoiceOver 등)를 구동해 E2E 단계에서 실제로 읽히는 문장을 기록한다. 묻는 질문은 "그 정보가 실제로 어떻게 들리는가"이다.
  [[비시각 정보 모드]]가 전달될 수 있는 정보의 재료를 본다면, 이 모드는 특정 스크린 리더·버전·설정·브라우저 조합에서 실제로 전달된 결과를 본다. 그 조합 하나의 결과일 뿐이라는 점도 기록에 밝힌다.
실현 가능성: |
  2026-10 조사 기준이며 직접 실행해 확인하지는 않았다.
  - Guidepup(`@guidepup/guidepup`, `@guidepup/playwright`, MIT)이 NVDA(Windows), VoiceOver(macOS), Orca(Linux)를 자동 조작하고 발화 로그를 수집한다. NVDA는 Remote 프로토콜로 speak 메시지를 받고, VoiceOver는 AppleScript로 읽는다. 2026-10에도 유지되고 있다.
  - GitHub Actions의 Windows·macOS 호스티드 러너에서 Guidepup 자체 워크플로가 돌고 있다.
  - W3C AT Driver는 아직 Editor's Draft이고 구현체 활동이 정체되어 의존성으로 부적합하다.
  - 가상 스크린 리더(`@guidepup/virtual-screen-reader`)는 사양 기반으로 발화 로그를 흉내 내지만 실제 스크린 리더가 아니다.
제약: |
  - headed 브라우저와 직렬 실행이 강제되어 느리다.
  - OS별 전용 러너가 필요하고, macOS는 SIP 해제 등 보안 설정 변경이 필요하다.
  - 발화 타이밍 때문에 결과가 흔들린다. Guidepup 예제도 재시도와 긴 timeout을 전제한다.
  - 스크린 리더 사용자는 가상 커서, 제목 단위 이동 같은 고유 명령으로 탐색하므로, E2E 단계를 스크린 리더 명령으로 옮기는 설계가 따로 필요하다.

  이 제약 때문에 첫 버전에서는 제외했다([[접근 모드:첫 버전 범위]]).
