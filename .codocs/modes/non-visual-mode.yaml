_codocs:
  id: non-visual-mode
  name: 비시각 정보 모드
  parent:
    - 접근 모드
개요: |
  화면을 보지 않고 브라우저 접근성 트리로 전달되는 정보(역할, 이름, 상태, 구조, 변화 알림)만으로 E2E의 각 단계를 관찰한다. 묻는 질문은 "보지 않고도 그것이 무엇인지, 지금 어디인지, 무슨 일이 일어났는지 알 수 있는가"이다.

  이 모드는 "전달될 수 있는 정보가 존재하는가"까지를 관찰한다. "실제로 어떻게 들렸는가"는 [[스크린 리더 모드]]의 영역이며, 이 차이를 사용자에게 분명히 알려야 한다.
두 층: |
  1. 키보드 경로 위에 정보를 덧붙이는 층: [[키보드 모드]]의 각 정지 지점과 실행 결과가 어떤 정보로 전달되는지 기록한다.
  2. 자체 탐색 경로를 갖는 층: 화면을 보지 않는 사용자는 제목(h1, h2)과 랜드마크(main, nav) 단위로 이동하는 경우가 많다. 목표가 어떤 제목·랜드마크 아래 있고 그 단위로 몇 번 이동하면 도달하는지 기록한다.
E2E 단계별 관찰: |
  - 목표 지목(`getByRole("button", { name: "예약 변경" })`): 목표의 역할·이름·상태, 구조상 위치(조상 랜드마크, 가장 가까운 제목)
  - 탐색 중: 지나가는 각 정지 지점의 역할·이름(이름 출처 포함)·상태
  - 실행(`click()`) 후: 포커스 이동 위치, 열린 대화상자의 역할과 이름, 상태 변화(예: expanded false → true)
  - 결과 확인(`expect(getByText("예약이 변경되었습니다")).toBeVisible()`): 그 결과가 보지 않고도 전달되는 경로가 있는지. live region 안에서 바뀌었는지, 포커스가 그리로 갔는지, 대화상자 이름인지 확인한다.

  마지막 항목은 테스트를 고치지 않고 질문만 바꾸는 것이다. 원본 E2E는 "화면에 보이는가"를 확인하고, 이 모드는 같은 시점에 "보지 않는 사용자에게도 전달되는가"를 관찰한다.
실현 근거: |
  2026-10 Playwright 1.64.1, Chromium에서 실측으로 확인했다.
  - 정지 지점 정보: CDP `Accessibility.getPartialAXTree`에 포커스 요소의 objectId를 넘겨 회당 약 2ms에 역할·이름·이름 출처·상태(required, invalid, expanded 등)를 얻었다. iframe(같은 출처)과 shadow DOM에서도 동작했다. `ariaSnapshot`으로 `:focus`를 조회하는 방식은 shadow DOM(strict 위반), iframe, body 포커스에서 실패했고 일부 상태가 빠져 채택하지 않는다. `page.accessibility`는 1.57에서 제거되었다.
  - 이름 출처: 크롬은 placeholder를 이름으로 대신 쓴다. 그래서 "이름 없음"이 아니라 "이름 출처가 placeholder"로 기록한다.
  - 구조 위치: `getFullAXTree`로 조상 랜드마크와 앞선 제목을 계산했다(예: main > region "예약 #1234", 가장 가까운 제목 h3, 제목 이동 3회).
  - 실행 후 변화: CDP 노드 기준 비교로 expanded 변화, modal 대화상자 추가, 포커스 이동을 잡았다.
  - 결과 전달 경로: role=status 안의 메시지는 live region(polite)으로, 일반 텍스트 메시지는 전달 경로 없음으로, 포커스가 이동한 메시지는 focus로 구분되었다. 세 경우 모두 원본 toBeVisible은 통과한다.
  - 비용과 안정성: 동작 5개·assertion 2개 테스트에서 평균 약 0.1초 증가(297 → 402ms), 90회 반복 실패 0회, 결과 동일.
설계 결정과 근거: |
  - 변화 관찰은 스냅샷 비교가 아니라 이벤트 기록을 주 수단으로 한다. 동작 직후 스냅샷 비교는 50ms 뒤 나타나는 비동기 메시지를 15회 중 한 번도 잡지 못했고, 페이지에 미리 심은 감시자(MutationObserver, focusin)는 모두 잡았다. 실제 웹앱은 대부분 비동기이기 때문이다. 스냅샷은 보조로 둔다.
  - 감시 스크립트는 페이지가 만들어지기 전에 context 단위로 등록한다. `page.setContent`의 첫 about:blank에서는 page 단위 init 스크립트가 실행되지 않았다. `document.open`이 focusin 리스너를 지우므로 다시 등록하는 처리가 필요하다.
  - 정지 지점 정보와 변화 비교는 CDP를 쓴다. CDP 접근성 도메인은 experimental이고 Chromium 전용이므로, 이 모드의 브라우저 지원 범위는 정해야 한다([[열린 질문]]).
알려진 한계: |
  - 동작과 동시에 새로 삽입된 live region은 실제 스크린 리더가 읽지 않을 수 있는데, 아직 "미리 존재했는지"를 구분하지 않는다.
  - aria-modal 대화상자 안에서는 바깥 제목까지 세므로 범위를 대화상자로 좁히는 보정이 필요하다.
  - 출처가 다른 iframe(OOPIF)은 별도 세션이 필요하며 확인하지 않았다.
  - 실제 발화 문장, 발화 순서, live region이 실제로 읽혔는지, 브라우즈 모드 같은 스크린 리더 고유 동작은 관찰할 수 없다.
