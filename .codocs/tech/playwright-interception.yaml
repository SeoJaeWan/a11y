_codocs:
  id: playwright-interception
  name: Playwright 가로채기
  parent:
    - Journey A11y
개요: |
  기존 테스트 코드를 고치지 않고, 테스트가 호출하는 Playwright 동작(click, fill, expect 등)을 접근 모드별 실행·관찰로 바꾸는 메커니즘과 그 확인 결과를 설명한다.
  2026-10~11 Playwright 1.64.1, Chromium, Node 24에서 실측으로 확인한 사실이다. 사용자는 설정 파일 하나에 project를 추가하고 테스트 import는 바꾸지 않는다.
확장 지점: |
  - Test Fixtures(`test.extend`): 내장 page fixture를 재정의해 접근 모드용 환경을 제공한다.
  - Test Projects: 일반 실행과 접근 모드 실행을 구분한다(예: `--project=keyboard-a11y`).
  - Custom Reporter: 단계별 결과를 수집하고 출력한다. Reporter는 결과 수집만 하며 동작을 바꿀 수 없다. Reporter는 메인 프로세스에서 돌아 page에 접근할 수 없으므로 관찰은 워커 쪽에서 해야 한다.
가로채기 방식: |
  Page나 Locator를 Proxy로 감쌀 필요 없이 프로토타입의 메서드를 패치한다.
  - Locator의 click, dblclick, hover, check, tap, selectOption, dragTo와 `page.click` 계열은 모두 클라이언트 `Frame.prototype`으로 모인다. Frame 단계에서는 selector 문자열만 받으므로 `frame.locator(selector)`로 다시 만든다. page.click은 기본적으로 strict가 아니므로 차이를 고려해야 한다.
  - `page.mouse`는 `Mouse.prototype`을 패치하고 `elementFromPoint`로 대상을 추정한다.
  - `ElementHandle.click`은 별도 경로로 잡히지 않는다.
  - expect matcher는 내부에서 `_expect`(비공개)를 호출하므로 이를 감싸면 assertion 시점에 관찰을 실행할 수 있다. `check()`와 `toHaveValue`는 Locator.click을 호출하지 않았다.
  - 패치는 워커 프로세스 전체에 적용된다. a11y project의 워커에만 설치해 일반 테스트에 영향을 주지 않는다.
  - 패치 안에서 원본 메서드를 다시 부를 때는 AsyncLocalStorage 가드로 재귀를 막는다.
단계 보고: |
  - 일반 project는 평소와 같다.
  - a11y project는 `test.step(title, fn, { box: true, location })`으로 요약 단계를 만든다. 호출 위치는 Error stack에서 얻어 공개 `location` 옵션으로 넘기며 사용자 테스트 줄을 가리킨다.
  - `step.attach`로 기록을 단계에 붙이고 리포터의 `TestStep.attachments`와 `result.attachments`에서 읽는다.
  - 평소 `page.keyboard.press`는 Tab마다 단계를 만들므로 요약 단계 아래가 길어진다. CDP로 키를 보내면 Tab 자체는 단계를 만들지 않고, Tab과 Shift+Tab 순서, trusted 이벤트, 키보드 click 활성화(detail=0)가 정상이었다.
  - `box: true`는 자식 단계를 숨기지 않는다. 리포트의 Tab 줄은 자식 test.step으로 기록을 보여 주는 것이다.
  - 같은 테스트를 짝지을 때 testId는 project마다 달라서 쓰지 않고 파일과 제목 경로를 쓴다. 호출 위치와 순번은 단계 구분에 쓸 수 있다.
내부 API 의존: |
  constructor.prototype 접근, `_expect`, `use`의 fixture 함수는 공개 계약이 아니다. Playwright 버전마다 깨질 수 있으므로 peerDependency 범위를 명시하고 버전별 스모크 테스트로 감시해야 한다.
  `_wrapApiCall`의 `internal` 옵션은 도구의 호출을 리포트와 trace에서 숨기는 데 쓴다. `_instrumentation`, `setBoxedStackPrefixes`도 동작을 확인했지만 현재 구성에서는 필수가 아니다.
  TypeScript에서 prototype은 any라 타입 안전성이 없으므로 자체 인터페이스를 선언하는 것이 좋다.
지원 버전: |
  Playwright `>=1.54 <2`를 지원한다. 2026-11 결정이다.

  근거는 두 가지다.
  - 사용 분포: npm 지난주 다운로드 기준 `@playwright/test` 1.54 이상이 92.7%다. 1.51 이상은 94.3%, 1.49 이상은 95.4%로 더 내려도 늘어나는 비율이 작다. 다운로드 수에는 CI의 반복 설치가 섞여 실제 사용자 비율과 다를 수 있다.
  - 동작 확인: 1.64.1, 1.56.1, 1.55.1, 1.54.2에서 Locator 패치, CDP 접근성 정보, 키보드 활성화(detail=0), `Frame._expect` 패치, `_wrapApiCall` 숨김, 재시도 때 `beforeEach`·fixture 재실행, `test.step` location과 `step.attach`가 모두 동작했다. 1.51~1.53은 `_expect`가 `Locator`에만 있어 `Frame` 패치가 걸리지 않았고, 1.50 이하는 `step.attach`가 없었다.

  운영 방식:
  - 패키지의 peerDependency를 `>=1.54 <2`로 적는다.
  - CI에서 지원 범위의 모든 마이너 버전으로 시나리오를 돌려 새 버전에서 깨지는지 바로 안다([[테스트 작성 규칙:Playwright 버전별 실행]]).
  - 범위 밖 버전이면 테스트를 깨뜨리지 않고 접근성 실행을 끄고 경고를 남긴다.
  - 더 낮은 버전 요청이 생기면 `Locator._expect` 분기를 추가해 1.51까지 내리는 것을 검토한다.
도입 방식: |
  설정 파일 하나에 `projects: [{ name: 'chromium' }, ...a11yProjects()]`처럼 project를 추가한다. 별도 설정 파일을 두지 않고 테스트 파일의 import도 바꾸지 않는다.

  접근성 실행은 기본으로 꺼 둔다. `a11yProjects()`는 환경 변수 `A11Y`가 있을 때만 project를 돌려주고, 없으면 빈 배열을 돌려준다. 패키지를 설치해도 기존 `npx playwright test`, precommit, CI는 바뀌지 않아야 하기 때문이다. 2026-11 결정이다.
  - `npx playwright test`: 기존과 같다.
  - `A11Y=1 npx playwright test`: 원래 E2E와 접근성 실행을 함께 돌린다.
  - `A11Y=1 npx playwright test --project=a11y`: 접근성 실행만 돌린다.

  Windows의 환경 변수 문법 차이는 문서에서 안내한다(예: `cross-env`).

  설정 파일을 평가할 때 워커는 자기 project를 알 수 없으므로 첫 지점은 fixture다. a11y project의 `use`에 fixture 함수를 넣어 그 워커에서만 패치를 설치했고, `workers: 1`에서도 project별 워커가 분리되었다. 일반 project의 reporter 단계, HTML 단계, trace 액션 목록은 패키지가 없을 때와 정규화 비교로 같았다.
  패치만 설치하고 그대로 통과시키면 일반 실행의 단계 위치가 바뀌고, auto fixture는 단계가 추가되므로 일반 project에는 어느 쪽도 두지 않는다.
  `use`에 fixture 함수를 넣는 방식은 문서화되지 않아 업그레이드 시 깨질 수 있다.

  설치 장치가 `testIdAttribute` 칸을 빌리므로 사용자의 test id 이름을 그대로 돌려준다. 테스트가 시작될 때 사용자 설정 파일(`testInfo.config.configFile`, 워커에 이미 읽혀 있음)에서 값 하나를 정한다. 순서는 Playwright와 같이 이어받은 프로젝트의 값, 최상위 `use`의 값, 기본값 `data-testid`다. 요소를 찾을 때 여러 이름으로 다시 시도하지 않는다. 원래 실행에서 못 찾는 요소를 접근성 실행에서만 찾게 되기 때문이다. 2026-11 결정이다.
  - 2026-11 실측: 최상위 `data-qa`, chromium 프로젝트에만 `data-qa`, 설정 없음 세 경우 모두 접근성 실행의 `getByTestId`가 원래 실행과 같은 요소를 찾았다.
  - 다른 칸(`serviceWorkers`)도 동작했지만, API 모킹 도구(MSW)를 쓰는 사용자가 바꾸는 설정이라 쓰지 않는다.
  - 한계: 테스트 코드에서 `selectors.setTestIdAttribute()`로 바꾼 값은 설정 파일에 없어 알 수 없다.
