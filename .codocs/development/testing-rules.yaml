_codocs:
  id: testing-rules
  name: 테스트 작성 규칙
  parent:
    - Journey A11y
개요: |
  도구를 무엇으로, 어떤 구조로 테스트하는지 정한다. 이 도구는 앱이 아니라 테스트 도구를 테스트하므로, 케이스마다 검증할 앱과 그 앱을 도는 E2E, 도구가 남겨야 하는 기록이 한 묶음이다.
  개발은 TDD로 한다. 케이스를 먼저 쓰고, 전부 실패하는 상태에서 기능을 구현하며 하나씩 통과시킨다. 2026-11 결정이다.
실사용 상황 목록: |
  도달:
  - 일반 버튼: Tab N으로 도달
  - 다른 출처 iframe 안 결제 버튼: 프레임 안팎을 Tab으로 지나 도달, 지점에 프레임 표시
  - 열린 shadow DOM 안 버튼: 도달. 닫힌 shadow DOM 버튼은 지나가는 지점으로 이름까지 기록
  - `div`에 클릭만 붙인 요소, `tabindex="-1"` 버튼: 한 바퀴 뒤 도달 못 함, 실패로 종료
  - 표준 탭 메뉴: Tab과 방향키로 도달
  - role 없이 만든 탭: 도달 못 함
  - 모달 안에 갇힘: 모달 안 한 바퀴 뒤 도달 못 함
  - 버튼 안 글자를 지목: `ancestor`로 도달
  - `testIdAttribute: 'data-qa'`인 프로젝트에서 `getByTestId`로 지목: 원래 실행과 같은 요소에 도달
  - 링크 둘이 든 카드: 도달 못 함

  실행:
  - 일반 버튼을 Enter로 실행: 다음 줄 통과
  - Space만 처리하는 `div role="button"`: 1회차 Enter 실패, 2회차 Space 통과(`flaky`)
  - 키 처리가 없는 `div role="button"`: Enter·Space 모두 실패, 실패로 종료
  - 더블클릭 편집: Enter 실패, Space 통과
  - 더블클릭만 되는 항목: 모두 실패, 실패로 종료
  - `aria-keyshortcuts="F2"` 선언: F2 통과(`declared`)
  - 선언한 키가 동작 안 함: F2 실패, Enter 통과
  - 입력창: 키보드로 입력, 다음 줄 통과
  - 날짜·시간 입력: 칸 순서를 읽어 칸마다 입력, 맞는 값
  - `contenteditable`과 편집기: Ctrl+A 후 키 입력
  - 색 선택: Tab 도달과 Enter로 창 열림을 확인하고 값은 원래 방식, 그 사실을 기록
  - `page.mouse.click(x, y)`: 좌표 아래 버튼을 목표로 추정해 도달, 추정임을 기록. canvas 좌표는 도달 못 함
  - 파일 업로드: 보이는 입력, 숨긴 입력, dropzone은 Enter로 파일 창이 열려 성공. 옆 버튼이 여는 방식은 후보 추측으로 성공. `label`이 감싼 `hidden` 입력과 끌어 놓기 전용은 도달 못 함
  - 입력 뒤 활성화되는 버튼, 늦게 나타나는 버튼: 준비될 때까지 기다린 뒤 도달
  - 계속 비활성인 버튼: 원래 Playwright와 같은 시간 초과 실패
  - 드롭다운 선택(`selectOption`): Space로 열고 방향키로 고른 뒤 Enter, `change` 한 번
  - 라디오 버튼: 방향키로 목표까지 가며 선택, 지나가며 선택된 항목 기록
  - 자동완성: 글자마다 키로 입력해 제안 목록이 열리고, 목록 안에서 ↓로 옵션까지 가서 Enter. 역할 없는 제안 목록은 도달 못 함

  전달되는 정보:
  - 아이콘만 있고 이름이 없는 버튼: 이름 없음, 요약에 개수
  - `aria-expanded`가 없는 메뉴 버튼: 상태 칸이 비어 있음
  - 이름 출처: 글자, `aria-label`, `label`
  - 랜드마크와 가까운 제목

  흐름:
  - 모달이 열리며 포커스가 모달로 이동: 다음 단계 Tab 1
  - 모달이 열려도 포커스가 그대로: 다음 단계 시작 포커스가 원래 버튼
  - 페이지 이동 후: 시작 포커스 body
  - SPA 이동 후 포커스가 사라짐: `focusLost`, Tab은 사라진 요소 자리에서 시작
  - SPA 이동 후 새 화면 제목으로 포커스 이동: 시작 포커스가 제목
  - Tab 순서가 화면 순서와 다름: 지나간 순서 그대로 기록

  처음 표에 없던 상황(선택, 라디오, 자동완성, 링크 이동, 기다림, iframe·shadow DOM, test id, 특수 입력, 파일 업로드, 색 선택, 좌표 동작)은 2026-11에 도구 동작을 정하고 위 목록에 넣었다. 실제 서비스에 직접 써 보며 새로 발견되는 상황도 같은 방식으로 정한다.
실행 방식: |
  `pnpm test:scenarios` 하나로 두 종류의 시나리오를 모두 돌린다. 안쪽 실행과 바깥 비교 두 겹이다. 2026-11 결정이다.

  1. 묶음 나누기: 정의 파일을 읽고 설정이 같은 케이스끼리 묶는다. 대부분은 기본 설정 묶음이고, 설정이 다른 케이스(`testIdAttribute`, `actionTimeout`, `A11Y` 끔, 지원 범위 밖 Playwright 버전)만 따로 묶는다.
  2. 안쪽 실행: 묶음마다 그 E2E 파일들을 사용자처럼 평범하게 실행한다(예: `A11Y=1 npx playwright test <파일들>`). 묶음 안에서는 병렬로 돈다. 끝나면 묶음 폴더에 `a11y-results.json`, 테스트별 결과와 단계 줄(Playwright JSON 리포트), 케이스별 trace가 남는다. E2E 파일 쪽에서는 아무것도 하지 않는다.
  3. 바깥 비교: 바깥도 Playwright Test다. 케이스 하나가 테스트 하나이고 이름은 `공통 조각 › 행위 › 케이스`, `E2E 케이스 › 묶음 › 케이스`다. 브라우저를 열지 않고 2단계 결과물만 읽어 [[테스트 작성 규칙:기대값]]대로 비교한다. 각 테스트에 안쪽 trace와 기대·실제 JSON을 첨부한다([[테스트 작성 규칙:결과 보기]]).
  4. 보기: [[테스트 작성 규칙:결과 보기]]를 따른다.

  두 겹인 이유: 안쪽은 사용자가 쓰는 모습 그대로여야 해서 비교 코드를 넣을 수 없고, 바깥에서 비교해야 기대와 다른 것을 실패로 표시할 수 있다. 케이스마다 따로 실행하면 실행마다 시작 시간(약 2초)이 들어 케이스가 많으면 몇 분이 걸리므로 묶어서 돌린다.
  시나리오 표 화면은 버전 1에서 만들지 않는다.
작업 순서: |
  버전 1은 케이스를 먼저 모두 쓰고 기능을 구현한다. 2026-11 결정이다.
  1. 환경: 저장소 설정, 도구, 시험용 앱, 실행기([[테스트 작성 규칙:실행 방식]])를 만든다. 실행기는 단순한 케이스 하나로 먼저 확인한다.
  2. 케이스: 공통 조각 시나리오와 E2E 시나리오 케이스를 모두 쓴다. 화면, E2E, 기대값까지 쓰고, 모든 E2E가 도구 없이 평범하게 통과하는지 확인한다.
  3. 구현: 케이스를 하나씩 통과시킨다.

  구현 전 케이스는 정의 파일에 "구현 전"으로 표시하고 바깥 테스트를 Playwright `test.fail()`로 돌린다. 실패해야 통과로 보므로 필수 검사 `시나리오 결과`가 병합을 막지 않는다. 구현해서 케이스가 통과하기 시작하면 `test.fail()`이 실패로 알려 주고, 그때 표시를 뗀다.
테스트 층: |
  2026-11 결정이다.

  ```text
  단위 테스트          구현 코드 (Vitest)
  공통 조각 시나리오    도구의 기능 하나하나 (세부 필드 비교, Playwright Test)
  E2E 시나리오 케이스   접근성 E2E 결과물 (결과 전체 비교, Playwright Test)
  ```

  | 층 | 무엇 | 언제 쓰나 |
  |---|---|---|
  | 단위 테스트 | 구현에 필요한 코드 자체의 테스트 | 코드를 쓰며 필요할 때. 고칠 때 깨지지 않게 지킨다 |
  | 공통 조각 시나리오 | 도구의 기능 하나하나가 맞게 동작하는가([[테스트 작성 규칙:공통 조각 시나리오]]) | CI에서 전부 돌린다 |
  | E2E 시나리오 케이스 | 접근성 E2E의 결과물이 생각한 대로 나오는가([[테스트 작성 규칙:실사용 상황 목록]]) | CI에서 전부 돌린다. 모두 통과하는 것이 버전 1의 목표다 |

  두 종류의 시나리오는 같은 방식으로 돌린다. 평범한 E2E 파일을 `A11Y=1`로 실행하고 끝난 뒤 결과를 읽어 비교한다. 차이는 기대값을 무엇으로 적느냐뿐이다([[테스트 작성 규칙:기대값]]).
  결과물은 시나리오의 Playwright 리포트와 trace로 확인한다. 내부 코드를 읽지 않아도 케이스를 열면 도구가 한 일(Tab 경로, 누른 키, 남긴 기록)을 화면으로 따라갈 수 있어야 한다.

  실제 서비스의 E2E는 시나리오와 CI에 넣지 않는다. 구현한 뒤 직접 써 보며 피드백을 얻는 용도다([[테스트베드:실 서비스]]).
단위 테스트: |
  구현에 필요한 코드를 테스트한다. 결과물 확인용이 아니라 코드를 고칠 때 깨지지 않게 지키는 용도다.
  계산하는 부분과 브라우저를 다루는 부분을 나눠 쓴다. 예를 들어 어떤 방향키를 누를지는 평범한 값을 받는 함수로 빼고, 실제로 키를 누르는 코드는 따로 둔다. 예: 키 후보 순서, 방향키 고르기, 시간 초과 순서, JSON 만들기.
테스트 시나리오: |
  E2E 시나리오 케이스 하나가 [[테스트 작성 규칙:실사용 상황 목록]]의 한 줄이다. 케이스는 실제 화면처럼 만든 페이지, 그 페이지를 도는 평범한 E2E, 개발자가 받아 보는 결과물로 구성하고, 근거 문서는 E2E 파일에서 연결한다([[테스트 작성 규칙:문서 연결]]).
  - E2E는 우리 도구를 통과시키려고 쓰지 않는다. 개발자가 원래 쓰는 방식 그대로 쓰고, 도구가 거기서 무엇을 남기는지 본다.
  - 페이지에는 실제 서비스에서 흔한 접근성 문제를 자연스럽게 넣는다. 예: `div`로 만든 링크, 아이콘만 있는 버튼, 포커스를 옮기지 않는 모달.
  - 흐름 묶음처럼 여러 단계가 이어져야 하는 케이스는 여러 줄짜리 사용자 흐름으로 쓴다.
시나리오 구조: |
  2026-11 결정이다.

  ```text
  src/
  └─ walk/
     ├─ choose-arrow-key.ts
     └─ choose-arrow-key.test.ts           단위 테스트는 소스 옆
  test/
  ├─ app/                                  Vite + React 앱
  │  ├─ pieces/<행위>/<케이스 id>.tsx       → /pieces/<행위>/<케이스 id>
  │  └─ cases/<묶음>/<케이스 id>.tsx        → /cases/<묶음>/<케이스 id>
  ├─ e2e/                                  평범한 Playwright E2E
  │  ├─ pieces/<행위>/<케이스 id>.spec.ts
  │  └─ cases/<묶음>/<케이스 id>.spec.ts    묶음: reach, run, info, flow
  ├─ scenarios/                            정의 파일
  │  ├─ pieces/<행위>.scenario.ts           행위마다 하나
  │  └─ cases/<묶음>.scenario.ts            묶음마다 하나
  ├─ runner/                               실행기(묶음 나누기, 비교, 바깥 테스트)
  └─ playwright.config.ts                  사용자 설정과 같은 모양. e2e/를 일반 실행과 접근성 실행으로 돌린다
  ```

  파일 위치와 이름 규칙이다. 2026-11 결정이다.
  - 공통 조각과 E2E 시나리오 케이스는 화면, E2E 파일, 정의 파일을 모두 따로 둔다. 같은 상황이 양쪽에 필요해도 파일을 함께 쓰지 않는다. 그래서 E2E 파일 하나가 테스트 하나이고 케이스 하나다.
  - 단위 테스트는 소스 옆의 `*.test.ts`(Vitest), E2E는 `*.spec.ts`(Playwright 관례)다. 확장자로 나뉘어 두 도구가 서로의 파일을 집어 가지 않는다.
  - 파일·폴더·케이스 id는 영어 kebab-case이고, 테스트 제목과 케이스 설명은 한국어다.
  - npm 패키지에는 `package.json`의 `files`로 `src`의 빌드 결과만 넣는다. `*.test.ts`와 `test/`는 설치되지 않는다.

  E2E 파일:
  - 우리 패키지를 모르는 평범한 E2E다. `@playwright/test`의 `test`, `expect`, `page`만 쓰고 우리 도구나 도우미를 import하지 않는다. lint가 `test/e2e/` 안에서 `@playwright/test` 외의 import를 막는다.
  - 우리 도구 없이 `npx playwright test`로 돌려도 통과해야 한다. `A11Y=1`을 붙이면 접근성 실행이다. 사용자가 자기 E2E에 도구를 붙이는 상황과 같다.
  - 파일과 `test/playwright.config.ts`는 사용자가 보는 예제도 된다. 기대값은 여기에 섞지 않는다.
  - 파일 하나에 테스트 하나, 케이스 하나다. 정의 파일의 케이스와 리포트의 테스트가 1:1로 이어진다.

  정의 파일은 `test/scenarios/pieces/`(공통 조각)와 `test/scenarios/cases/`(E2E 시나리오 케이스)에 나눠 둔다. 모양은 같고 기대값만 다르다([[테스트 작성 규칙:기대값]]).
  ```ts
  // test/scenarios/pieces/accept-reach.scenario.ts
  export const scenario = definePieceScenario({
    name: '도달을 인정한다',
    conditions: {
      relation: { label: '포커스와 목표의 관계', values: ['같은 요소', '버튼 안 글자', 'label', '안의 입력 하나', '안의 링크 여럿'], base: '같은 요소' },
    },
    cases: [
      {
        id: 'text-in-button',
        change: { relation: '버튼 안 글자' },
        e2e: 'e2e/pieces/accept-reach/text-in-button.spec.ts',
        expected: { steps: [{ keyboard: { reached: true, reachedBy: 'ancestor' } }, {}] },
        todo: true,
      },
    ],
    noCase: {},
  });
  ```
  - `change`는 기준값에서 바꾼 조건 하나다. 빠진 값 검사에 쓴다.
  - E2E 시나리오 케이스는 `situation`에 [[테스트 작성 규칙:실사용 상황 목록]]의 줄을 적는다.
  - `e2e`는 케이스가 돌릴 E2E 파일 경로다. 코드를 정의 파일에 넣지 않는다.
  - `noCase`는 케이스를 두지 않는 값과 그 이유다.
  - E2E 시나리오 케이스는 `defineE2eScenario`로 쓰고 `expected`에 기대 JSON 경로(`scenarios/cases/<묶음>/<케이스 id>.expected.json`)를 적는다.
  - `todo: true`는 구현 전 표시다([[테스트 작성 규칙:작업 순서]]).

  케이스 화면:
  - React 앱 하나에 케이스마다 화면을 따로 둔다. 한 케이스를 고쳐도 다른 케이스에 영향이 없다.
  - 공통 머리말 메뉴 등으로 실제 서비스 같은 Tab 경로를 만들고, 접근성 문제는 화면 안에 자연스럽게 넣는다.
  - React를 고른 이유는 실제 서비스에서 가장 흔하고, SPA 포커스 사라짐·포털 모달·다시 그릴 때의 포커스 같은 동작이 이런 앱에서 생기기 때문이다. 정적 HTML은 단순하지만 이 동작을 재현하기 어렵다.
  - 다른 출처 iframe처럼 두 번째 주소가 필요하면 같은 앱을 다른 포트로 하나 더 띄운다.
공통 조각 시나리오: |
  도구의 기능 하나하나를 확인하는 케이스다. 행위마다 조건과 값을 문서 규칙에서 빠짐없이 뽑고, 기준값에서 조건 하나씩 바꾼 케이스를 둔다. 케이스가 없는 값은 이유를 적고, 이유도 없으면 빠진 값으로 드러나게 한다.

  | 행위 | 대표 조건 |
  |---|---|
  | 접근성 실행을 켜고 끈다 | `A11Y` 유무, 기존 프로젝트 영향, 지원 버전 밖 |
  | 목표까지 찾아간다 | 목표 요소 종류, 시작 포커스 |
  | 도달을 인정한다 | 같은 요소, 버튼 안 글자, label, 안의 입력 하나, 안의 링크 여럿 |
  | 찾기를 멈춘다 | 한 바퀴, Tab 상한, 모달 안에 갇힘 |
  | 키가 정해진 동작을 실행한다 | `click`, `fill`(글자·날짜·시간·범위), `check`, `press`, `selectOption`, 라디오, 링크, 자동완성 옵션, 색 선택 |
  | 키를 추측해 실행한다 | `dblclick`, `hover`, 우클릭, Space만 받는 `div role="button"`, 선언된 키, 파일 창을 여는 버튼 |
  | 진행하지 못하면 끝낸다 | 도달 못 함, 후보 키 모두 실패, `dragTo` |
  | 지점의 정보를 기록한다 | 역할, 이름, 이름 출처, 상태, 랜드마크, 제목 |
  | 결과를 남긴다 | 리포트 단계, 요약, 이미지, JSON |
기대값: |
  두 종류의 시나리오 모두 기대값을 결과 JSON(`a11y-results.json`의 그 케이스 부분과 테스트 결과)과 같은 모양으로 적고, 비교 범위만 다르다. 2026-11 결정이다.

  | 종류 | 기대값 | 비교 |
  |---|---|---|
  | 공통 조각 시나리오 | 그 기능이 남기는 필드만 적은 JSON | `toMatchObject`, 적은 필드만 |
  | E2E 시나리오 케이스 | 그 케이스의 결과 JSON 전체 | `toEqual`, 전체 |

  공통 조각:
  ```ts
  // 도달을 인정한다 › 버튼 안 글자
  expected: { steps: [{ keyboard: { reached: true, reachedBy: 'ancestor' } }] }
  ```
  - 적지 않은 필드는 무시한다. 다른 필드는 그 필드의 조각 케이스가 확인한다.
  - `steps`는 순서대로 비교하고 확인할 것이 없는 단계는 `{}`로 자리만 채운다. `stops`는 `index`로 짝짓고, `attempts`는 순서까지 전부 비교한다.

  E2E 시나리오 케이스는 케이스 하나의 결과 JSON 전체를 한 번에 비교한다. 케이스마다 화면이 따로라 다른 케이스의 화면 변경으로 깨지지 않아 전체 비교가 부담스럽지 않다. 기대 JSON은 케이스 옆 파일(`<케이스 id>.expected.json`)에 두고 정의 파일은 그 경로를 가리킨다.
  리포트 단계 줄의 문구는 이 비교에서 빠진다. 문구가 맞는지는 공통 조각의 "결과를 남긴다" 케이스에서 확인한다([[기록과 리포트:리포트 구성]]).
문서 연결: |
  테스트와 구현 코드는 `@codocs \[[문서:섹션]]` 표기로 근거 문서에 연결한다. 2026-11 결정이다.

  | 대상 | 연결 방법 |
  |---|---|
  | E2E 파일 | `test(...)` 바로 위에 `// @codocs \[[문서:섹션]]` 주석 |
  | 정의 파일 | 연결하지 않는다. E2E 경로와 기대값만 둔다 |
  | 단위 테스트 | `describe` 하나가 문서 섹션 하나이고, 바로 위에 `// @codocs \[[문서:섹션]]` |
  | 구현 코드 | 문서의 규칙을 구현한 함수의 JSDoc에 `@codocs \[[문서:섹션]]` |

  - E2E 파일의 주석은 import가 아니어서 평범한 E2E라는 원칙을 지킨다. E2E를 읽는 사람이 어떤 규칙을 확인하는지 파일 안에서 알 수 있다. 공통 조각과 E2E 케이스는 파일이 따로라 각 파일이 자기 근거 섹션만 가리킨다.
  - codocs는 `@codocs`가 붙은 표기만 코드 참조로 읽는다. 주석과 문자열 안의 표기는 읽었고, `@codocs` 없이 문서 이름만 담은 `docs` 필드는 읽지 않았다(2026-11 실측). 그래서 정의 파일에 `docs` 필드를 두지 않는다.
  - 얻는 것: 끊긴 연결은 codocs 검사에서 오류가 나고, 문서 이름을 바꾸면 코드 표기도 함께 고쳐지며, 문서 섹션 옆 `코드 N곳` 표시로 그 규칙의 테스트로 갈 수 있다.
  - 커버리지 숫자 기준은 두지 않는다. 문서의 `코드 N곳` 표시가 없는 섹션으로 케이스가 빠진 규칙을 찾는다.
결과 보기: |
  바깥 테스트의 Playwright 리포트 하나로 본다. 케이스 하나에 다음이 보인다. 2026-11 결정이다.
  - 비교 결과: Playwright `expect`가 실패하면 기대와 실제의 JSON 차이를 리포트에 그대로 보여 준다. 따로 화면을 만들지 않는다.
  - `trace` 첨부: 그 케이스의 E2E를 접근성 실행으로 돌린 trace다. 리포트의 "View Trace"로 연다.
  - `expected.json`과 `actual.json` 첨부: 나와야 하는 결과와 실제 결과다. 통과한 케이스도 무엇이 나왔는지 볼 수 있다.

  2026-11 실측: 바깥 테스트가 안쪽 trace를 `trace`라는 이름(`application/zip`)으로 첨부하자 바깥 HTML 리포트에 "View Trace" 버튼이 생기고, 누르면 안쪽 E2E의 클릭·확인 단계와 화면이 그대로 보였다. trace 화면은 서비스 워커를 쓰므로 리포트 파일을 직접 열지 않고 `playwright show-report`로 띄워야 한다.

  로컬에서는 `pnpm test:scenarios` 뒤 `pnpm test:scenarios:report`로 리포트를 띄운다. CI에서 리포트를 어떻게 남기고 열지는 CI 규칙에서 정한다.
Playwright 버전별 실행: |
  지원 범위([[Playwright 가로채기:지원 버전]])의 모든 마이너 버전에서 시나리오를 돌린다. 2026-11 결정이다.

  | 언제 | 무엇을 |
  |---|---|
  | PR과 `main` 푸시 | 단위 테스트는 저장소에 고정된 버전으로 한 번. 두 종류의 시나리오는 지원 하한부터 최신까지 모든 마이너 버전과, 출시 전 beta가 있으면 beta까지 버전마다 동시에 실행한다 |
  | 매일 정기 실행 | 지원 범위의 모든 마이너 버전과 beta로 시나리오를 실행한다. 새 Playwright가 나오거나 곧 나올 버전에서 깨지는지 다음 PR을 기다리지 않고 안다([[코드 작성 규칙:CI 실행 계기]]) |
  | 로컬 | 고정된 버전 하나만. 다른 버전은 CI에 맡긴다 |

  - 하한은 `package.json`의 지원 범위에서 읽어, 하한을 바꾸면 CI도 따라간다.
  - beta 실패는 아직 출시 전이라 CI 전체를 막지 않고 알림만 남긴다.
  - "지원 범위 밖" 케이스는 범위 밖 버전(예: 1.53)으로만 돌린다.
  - 저장소가 공개라 GitHub 호스팅 러너를 시간 제한 없이 무료로 쓴다. 공개 저장소에서는 누구나 포크해 PR을 보낼 수 있어, 모르는 코드가 실행되는 개인 서버 러너는 쓰지 않는다.

  참고한 사례(2026-11 각 저장소의 CI 설정): playwright-bdd는 PR마다 최소 지원 버전부터 최신까지 모든 마이너 버전과 beta를, 매일 beta를 돌린다. Next.js와 typescript-eslint는 기본 버전과 가장 오래된 지원 버전을 돌린다. React Testing Library는 React 18, 최신, canary, experimental을 돌리고 최신이 아닌 버전의 실패는 막지 않는다. axe-core-npm의 Playwright 패키지는 고정된 한 버전만 돌린다. 이 도구는 버전마다 달라질 수 있는 Playwright 내부 기능에 기대므로 playwright-bdd 방식을 따른다.
