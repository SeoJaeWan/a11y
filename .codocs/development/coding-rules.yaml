_codocs:
  id: coding-rules
  name: 코드 작성 규칙
  parent:
    - Journey A11y
개요: |
  코드를 쓰고 검사하는 규칙이다. 공통 규칙에 이 패키지에만 필요한 규칙을 더한다. 2026-11 결정이다.
  규칙은 가능한 한 도구(TypeScript, ESLint, Prettier, commitlint, Git 훅)로 강제하고, 도구로 강제하지 못하는 것만 리뷰에서 본다. 세부 설정은 설정 파일을 만들며 영역별로 정하고 동작을 확인한다.
공통 규칙: |
  | 영역 | 규칙 | 강제 도구 |
  |---|---|---|
  | 포맷 | 작은따옴표, 세미콜론, 끝 쉼표, 100자, 2칸, LF 고정, `.codocs` 제외 | Prettier, `.gitattributes` |
  | 예외 처리 | `eslint-disable` 주석 금지, 예외는 설정 파일에서 경로 단위 | `noInlineConfig`, `--max-warnings=0` |
  | 타입 | `strictTypeChecked`, `type`만 사용, `any` 금지, Promise 무시 금지, 공개 함수 반환 타입 명시 | typescript-eslint, `strict`·`noUncheckedIndexedAccess` |
  | 이름 | 변수·함수 camelCase, 타입 PascalCase, 상수 UPPER_SNAKE_CASE, boolean은 `is`·`has`·`can`·`should` | `naming-convention` |
  | 함수 | 이름 있는 함수는 `function` 선언, 콜백만 화살표 함수 | `func-style` |
  | import·export | named export만, 자동 정렬, `import type` 분리 | `simple-import-sort` |
  | 파일 | kebab-case, `utils`·`helpers` 같은 이름 금지, `index`는 패키지 진입점에만 | `check-file` |
  | JSDoc | 모든 함수에 설명, `@param` 설명 필수, 타입은 적지 않음 | `eslint-plugin-jsdoc` |
  | 커밋 | Conventional Commits, 제목 영어, 본문 한국어 | commitlint |
  | 브랜치 | `종류/짧은-설명` | pre-push 훅, CI |
  | Git 훅 | 커밋 때 바뀐 파일만 lint·포맷, 타입 검사, 관련 테스트 | husky, lint-staged |

패키지 규칙: |
  | 규칙 | 이유 | 강제 방법 |
  |---|---|---|
  | Playwright 내부 접근은 `src/playwright-internal/`에서만 | 버전이 바뀔 때 고칠 곳을 한곳에 모은다([[Playwright 가로채기:내부 API 의존]]) | 그 폴더 밖에서 `_`로 시작하는 속성 접근과 prototype 접근 금지 |
  | 내부 API 타입은 그 폴더에서 직접 선언 | `any` 금지를 지키며 prototype을 다룬다 | `no-explicit-any` |
  | 브라우저 안에서 도는 코드는 `src/page-scripts/` | `page.evaluate`로 보내는 함수는 바깥 변수를 쓸 수 없어, 섞이면 실행 중에야 깨진다 | 폴더별로 DOM 타입과 Node 타입 분리 |
  | `test/e2e/`는 `@playwright/test`만 import | 테스트 시나리오의 E2E가 우리 도구를 모르는 평범한 E2E로 남아야 한다([[테스트 작성 규칙:시나리오 구조]]) | 그 폴더에 `no-restricted-imports` |
  | 공개 API는 `src/index.ts` 하나 | 내보낸 것은 모두 공개 약속이 된다 | `package.json`의 `exports` |
  | 패키지 형식 검사 | npm에서 타입과 경로가 깨지지 않았는지 확인한다 | publint, are-the-types-wrong(CI) |
  | 쓰지 않는 코드 검사 | 공개 패키지에 죽은 코드를 남기지 않는다 | knip |
  | 런타임 의존성 최소화 | 사용자 설치 부담을 줄인다. Playwright는 peerDependency다 | 리뷰, publint |
  | 버전 관리 | npm에 공개 배포한다 | Changesets |
언어: |
  - 공개 API의 JSDoc과 README는 영어로 쓴다. 오픈소스 사용자가 편집기에서 보는 설명이 JSDoc이기 때문이다.
  - 커밋 본문과 `.codocs` 설계 문서는 한국어로 쓴다.
  - 테스트 이름과 케이스 설명은 한국어로 쓴다. 리포트를 보고 결과물을 확인하는 사람이 읽기 위해서다([[테스트 작성 규칙]]).
Git 훅: |
  husky로 훅을 둔다. 커밋 때는 작업한 범위만 빠르게 검사하고 전체 검사는 CI에 맡긴다. 커밋을 자주 만들 때마다 전체 검사를 기다리지 않기 위해서다. 2026-11 결정이다.

  | 훅 | 검사 | 범위 |
  |---|---|---|
  | pre-commit | ESLint 자동 수정과 경고 0개 | 스테이지된 `.ts` 파일(lint-staged) |
  | | Prettier 포맷 | 스테이지된 파일, `.codocs` 제외(lint-staged) |
  | | 타입 검사 | 프로젝트 전체, 증분(`tsc --incremental`) |
  | | 단위 테스트 | 바뀐 파일과 그 파일을 쓰는 테스트(`vitest related`) |
  | | 스테이지 보호 | 검사 중에 다른 프로세스가 스테이지를 바꾸면 커밋을 멈춘다 |
  | commit-msg | Conventional Commits, 제목 영어 | 커밋 메시지(commitlint) |
  | pre-push | 브랜치 이름 형식 | 푸시하는 브랜치(validate-branch-name) |

  - 스테이지 보호: git은 훅이 끝난 뒤 스테이지(index)를 다시 읽어 커밋을 만들어서, 그 사이 같은 폴더의 다른 프로세스가 `git add`한 파일이 섞일 수 있다. 훅 시작과 끝의 `git write-tree` 결과가 다르면 멈춘다.
  - 시나리오는 브라우저와 안쪽 실행까지 돌아 무거워 훅에 넣지 않는다. CI가 모든 버전으로 돌린다([[테스트 작성 규칙:Playwright 버전별 실행]]).
  - codocs 문서 검증은 훅에 넣지 않는다. codocs 명령은 편집기·AI용 연결 서버(MCP)로만 동작하고 훅에서 쓸 검사 명령이 없다(2026-11 패키지 설명서로 확인). 문서 검증은 작업 중에 codocs 도구로 한다.
브랜치와 main 보호: |
  로컬 훅은 빠른 안내, GitHub는 실제로 막는 쪽이다. 두 기능 모두 널리 쓰이는 도구와 GitHub 기본 기능을 쓰고 직접 만들지 않는다. 2026-11 결정이다.

  | 검사 | 로컬 | GitHub |
  |---|---|---|
  | 브랜치 이름 `종류/짧은-설명` | pre-push 훅에서 validate-branch-name | PR의 CI 단계에서 같은 도구로 `-t <브랜치>` |
  | `main` 보호 | 없음 | 저장소 규칙(Rulesets): PR 필수, 필수 검사 통과, 강제 푸시 금지, 삭제 금지 |
  | 병합된 브랜치 | 없음 | 병합하면 원격 브랜치를 자동으로 지운다(Automatically delete head branches) |

  - 브랜치 이름: 종류는 커밋 종류와 같은 단어를 쓰고 commitlint 설정과 맞춘다. 설명은 소문자·숫자·하이픈이다. 직접 정하는 것은 이 정규식 하나다.
  - validate-branch-name은 주간 약 8만 다운로드로 가장 많이 쓰이고, `-t`로 임의의 이름을 검사할 수 있어 로컬과 CI에서 같은 도구를 쓴다(2026-11 조사). 브랜치 이름용 GitHub Action은 2024년 이후 갱신이 없어 쓰지 않는다.
  - GitHub 저장소 규칙에는 브랜치 이름 형식을 강제하는 규칙이 없다(2026-11 GitHub 문서). 그래서 이름은 CI가 검사한다.
  - `main`은 GitHub 서버가 막으므로 로컬 훅에서 따로 막지 않는다. `--no-verify`로도 뚫리지 않는다.
  - 저장소 규칙은 공개 저장소라 무료로 쓴다. 2026-11 API 확인에서 이 저장소는 조회됐고, 비공개 저장소는 "GitHub Pro로 올리거나 공개하라"며 거부됐다.
  - 적용 상태(2026-11): 저장소 규칙 `main 보호`에 PR 필수(승인 0명, 혼자 작업하므로), 강제 푸시 금지, 삭제 금지를 걸었다. `main` 직접 푸시는 "Changes must be made through a pull request"로 거부됐다. 병합된 브랜치 자동 삭제도 켜져 있다.
  - 필수 검사는 CI 작업이 생긴 뒤 그 이름으로 추가한다. 없는 검사를 필수로 걸면 PR을 병합할 수 없다.
명령: |
  훅과 CI는 아래 `pnpm` 명령만 부르고 도구를 직접 부르지 않는다. 도구를 바꿔도 명령 이름은 그대로다. 이름은 `동작`이 기본이고 범위나 방식이 다르면 `동작:세부`로 붙인다. 2026-11 결정이다.

  | 명령 | 하는 일 | 쓰는 곳 |
  |---|---|---|
  | `pnpm build` | 패키지를 빌드해 배포할 파일을 만든다 | CI, 배포 |
  | `pnpm lint` | ESLint 전체 검사, 경고 0개 | CI |
  | `pnpm format` | Prettier로 전체를 고친다 | 로컬 |
  | `pnpm format:check` | 포맷이 맞는지만 확인한다 | CI |
  | `pnpm typecheck` | 타입 검사 | 훅, CI |
  | `pnpm test` | 단위 테스트 전체(Vitest) | 로컬, CI |
  | `pnpm test:scenarios` | 공통 조각과 E2E 케이스 시나리오 전체 | 로컬, CI |
  | `pnpm test:scenarios:report` | 시나리오 리포트를 띄운다(trace 포함) | 로컬 |
  | `pnpm dev:app` | 케이스 화면용 React 앱을 띄운다 | 로컬 |
  | `pnpm lint:package` | 패키지 형식 검사(publint, are-the-types-wrong) | CI |
  | `pnpm knip` | 쓰지 않는 코드와 의존성 검사 | CI |
  | `pnpm verify` | lint, 포맷 확인, 타입 검사, 단위 테스트를 한 번에 | 로컬, PR 전 |

  시나리오 일부만 돌리기: `pnpm test:scenarios`는 Playwright 명령이라 뒤에 붙인 옵션이 그대로 전달된다. TDD로 기능 하나를 만들 때 그 기능의 케이스만 돌린다. 바깥 테스트 이름([[테스트 작성 규칙:실행 방식]])으로 고른다.
  ```bash
  pnpm test:scenarios --grep "도달을 인정한다"
  pnpm test:scenarios --grep "표준 탭 메뉴"
  ```
  빌드 도구(tsup, tsdown 등)는 저장소를 구성할 때 정한다.
CI 실행 계기: |
  GitHub Actions를 GitHub 호스팅 러너에서 돌린다. 2026-11 결정이다.

  | 계기 | 돌리는 것 | 이유 |
  |---|---|---|
  | PR(`main` 대상) | 전부: 브랜치 이름, lint, 포맷 확인, 타입 검사, 단위 테스트, 빌드, 패키지 형식, knip, 시나리오(지원 범위의 모든 마이너 버전과 beta) | 병합 전에 모두 확인한다. 필수 검사가 여기 걸린다 |
  | `main` 푸시 | 브랜치 이름을 뺀 전부 | PR을 검사한 뒤 `main`이 바뀌었을 수 있어 합친 결과를 다시 본다 |
  | 매일 정기 실행 | 시나리오만, 지원 범위의 모든 마이너 버전과 beta | 우리 코드는 그대로인데 Playwright가 새로 나오면 다음 PR을 기다리지 않고 바로 알기 위해서다. 버전 목록은 실행마다 npm에서 다시 받는다 |
  | 수동 실행 | 전부, 또는 Playwright 버전을 골라서 | 특정 버전 문제를 다시 확인할 때 쓴다 |

  운영 규칙:
  - 같은 PR에 새 커밋이 오면 진행 중인 이전 실행을 멈춘다.
  - `.codocs`나 `*.md`만 바뀐 PR은 시나리오와 빌드를 건너뛴다. 작업은 시작해서 "검사할 것 없음"으로 통과시킨다. 작업을 시작하지 않으면 필수 검사가 대기 중으로 남아 병합이 막히기 때문이다.
  - beta 실패는 PR을 막지 않는다([[테스트 작성 규칙:Playwright 버전별 실행]]).

  정기 실행 실패는 이슈로 쌓는다. 메일은 받은 사람만 보고 지나가지만, 이슈는 기록이 저장소에 남고 고친 PR과 연결되며 다른 사용자도 알려진 문제인지 볼 수 있다.
  - 실패하고 열린 이슈가 없으면 이슈를 만든다. 실패한 Playwright 버전, 실패한 케이스, 실행 링크를 적는다. 제목 예: `[정기 실행] Playwright 1.66에서 시나리오 실패`
  - 실패했는데 열린 이슈가 있으면 새로 만들지 않고 그 이슈에 댓글을 단다.
  - 성공했는데 열린 이슈가 있으면 "다시 통과함" 댓글을 달고 닫는다.
  - 이슈는 `ci-scheduled` 라벨로 구분한다. 러너에 기본으로 있는 `gh` 명령으로 만들고 닫으며, 그 작업에만 `issues: write` 권한을 준다.
  - GitHub가 저장소 주인에게 보내는 실패 메일은 계정 알림 설정이라 저장소에서 다루지 않는다.
CI 작업: |
  CI 작업은 다섯 가지다. 작업 이름이 필수 검사 이름이 되므로 버전이 바뀌어도 이름이 바뀌지 않게 나눈다. 2026-11 결정이다.

  | 작업 | 하는 일 | 필수 검사 |
  |---|---|---|
  | 변경 확인 | 문서만 바뀐 변경인지 판단해 다른 작업에 알린다 | - |
  | 브랜치 이름 | PR 브랜치 이름을 validate-branch-name으로 검사한다. PR에서만 돈다 | 예 |
  | 정적 검사 | 설치 한 번으로 lint, 포맷 확인, 타입 검사, 단위 테스트, 빌드, 패키지 형식, knip을 차례로 돌린다. 문서만 바뀌었으면 건너뛰고 통과한다 | 예 |
  | 버전 목록 | `package.json`의 지원 하한부터 npm 최신까지 마이너 버전 목록과, 출시 전 beta가 있으면 beta를 만든다 | - |
  | 시나리오(버전) | 버전마다 하나씩 동시에 실행한다. 그 버전의 Playwright와 Chromium을 설치하고 `pnpm test:scenarios`를 돌린다 | - |
  | 시나리오 결과 | 모든 버전 작업이 끝나면 결과를 모은다. beta를 모두 뺀 버전이 하나라도 실패하면 실패한다 | 예 |

  - `시나리오 결과`를 따로 두는 이유: 버전별 작업 이름은 새 Playwright가 나오거나 하한을 올리면 바뀐다. 이를 필수 검사로 걸면 버전이 바뀔 때마다 GitHub 설정을 고쳐야 하고, 사라진 이름이 남아 있으면 병합이 막힌다. 그래서 이름이 바뀌지 않는 작업 하나만 필수로 건다.
  - 정적 검사를 하나로 묶는 이유: 나누면 동시에 돌지만 작업마다 설치를 다시 해 느려진다. 단위 테스트가 커지면 나눈다.
  - knip은 쓰지 않는 파일·export·의존성과 빠진 의존성을 찾는다. 공개 패키지라 쓰지 않는 의존성은 사용자 설치를 무겁게 하고, 빠진 의존성은 사용자 환경에서야 "모듈을 찾을 수 없음"으로 깨진다.
  - 필수 검사는 `브랜치 이름`, `정적 검사`, `시나리오 결과` 세 개다. CI를 만든 뒤 저장소 규칙에 이 이름으로 추가한다([[코드 작성 규칙:브랜치와 main 보호]]).
병합 방식: |
  PR은 merge commit으로만 병합한다. 저장소 설정에서 squash와 rebase 병합을 꺼서 병합 버튼에 다른 방식이 나오지 않는다. 2026-11 결정이다.
  - 작업 대부분을 AI가 하고 커밋을 하나마다 의미 있는 단위로 만든다. 그 커밋이 `main`에 그대로 남아야 무엇을 왜 바꿨는지 따라갈 수 있다. squash는 PR 안의 커밋 단위를 없앤다.
  - 커밋이 그대로 남으므로 PR을 올리기 전에 오타 수정, wip 같은 잔손질 커밋을 정리한다.
  - 큰 오픈소스(Playwright, Next.js, React)는 대부분 squash를 쓴다. 검토한 대안이다.
CI 환경: |
  GitHub 호스팅 러너를 쓴다. 공개 저장소라 시간 제한 없이 무료이고, 포크에서 온 PR의 코드가 개인 서버에서 돌지 않는다. 2026-11 결정이다.

  | 작업 | 운영체제 | 범위 |
  |---|---|---|
  | 정적 검사, 버전별 시나리오 | Linux(`ubuntu-latest`) | [[코드 작성 규칙:CI 작업]] 전부 |
  | Windows 시나리오 | Windows | 고정 버전 하나로 시나리오만, PR마다. 결과는 `시나리오 결과`에 포함한다 |

  - Linux: Playwright 공식 CI 예시가 모두 `ubuntu-latest`다.
  - Windows: 도구가 사용자 설정 파일을 읽고 결과 파일과 trace를 저장해 경로 구분자 같은 Windows 전용 문제가 생기기 쉽고, 개발 환경도 Windows다. playwright-bdd도 Windows 전용 작업을 따로 둔다. 버전 전체를 Windows로 돌리면 시간만 늘어 하나만 둔다.
  - macOS는 Chromium만 지원하는 버전 1에서 두지 않는다.

  설치와 캐시:
  - 브라우저는 작업마다 `npx playwright install --with-deps --only-shell chromium`으로 받고 캐시하지 않는다. Playwright 문서는 "캐시를 복원하는 시간이 내려받는 시간과 비슷하고" Linux의 운영체제 의존성은 캐시할 수 없어 브라우저 캐시를 권장하지 않는다(2026-11 확인).
  - `--only-shell`은 전체 Chromium 대신 headless shell만 받는다. 시나리오는 headless로 돌고, Playwright는 headless에서 기본으로 headless shell을 쓴다. 지금까지의 실측도 headless shell로 했다.
  - npm 패키지는 공식 `setup-node`의 pnpm 캐시로 캐시한다.
  - GitHub 러너는 작업마다 새로 만들어지고 끝나면 지워져 버전별 브라우저가 쌓이지 않는다.
