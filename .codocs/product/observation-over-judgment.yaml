_codocs:
  id: observation-over-judgment
  name: 관찰과 판단의 분리
  parent:
    - Journey A11y
개요: |
  이 문서는 도구가 무엇을 기록하고 무엇을 판단하지 않는지, 기록이 테스트 성공·실패에 어떤 영향을 주는지를 정한다.
  도구는 판정 도구(린터)가 아니라 관찰 도구(프로파일러, Playwright trace viewer)다. 성능 프로파일러가 "느리다"고 판정하지 않고 "120ms가 걸렸고 호출 경로는 이렇다"를 보여주듯, 이 도구는 "Tab 10번에 도달했고 경로는 이렇다"를 보여준다.

  예를 들어 앞에 요소가 많아 Tab을 10번 눌러야 버튼에 도달한다면, 그것이 문제인지는 서비스의 맥락을 아는 개발자만 판단할 수 있다. 문제라면 기록에서 원인을 파악하고, 문제가 아니라면 현재 상황을 아는 것으로 충분하다.
기록하는 것: |
  E2E의 각 단계가 하나의 관찰 단위다. 단계마다 다음을 기록한다.
  - 원본 단계: E2E 코드의 위치와 동작, 목표 요소를 지목한 방법
  - 시작 상태: 단계 시작 시점의 포커스 위치
  - 탐색 경로: 사용한 키와 횟수, 지나간 각 정지 지점의 역할·이름·상태
  - 도달 여부: 목표에 도달했는지, 도달하지 못했다면 어디까지 탐색했는지
  - 키 안내: 실행 키를 어디서 알았는지([[키보드 모드:실행 키 선택]])
  - 실행과 그 뒤: 실행에 쓴 키, 다음 단계를 이어갈 수 있었는지, 포커스 이동, 열린 대화상자, 상태 변화, 결과 메시지의 전달 경로
  - 시도 범위: 어떤 조작을 시도했고 어떤 조작은 시도하지 않았는지

  모드별 관찰 항목은 [[키보드 모드]], [[비시각 정보 모드]], [[스크린 리더 모드]]에서 정한다. 기록의 구체적 데이터 구조는 아직 정하지 않았다([[열린 질문]]).
판단하지 않는 것: |
  도구는 문제 여부, 심각도, 접근성 점수를 판정하지 않는다.
  초기 기획의 PASS / BLOCKED / INEFFICIENT / UNVERIFIED 분류는 쓰지 않는다. 리포트의 요약과 표시는 `이름 없음 2`, `포커스 링 없음 2`, `도달 실패 0`처럼 사실만 적고 "문제", "경고" 같은 표현을 쓰지 않는다.

  판정을 하지 않으므로 오탐(틀린 판정)의 위험은 대부분 사라진다. 대신 기록이 실제로 일어난 일을 빠짐없이, 왜곡 없이 담는지가 품질 기준이 된다.

  사실과 해석의 경계 예시: "Tab 순환 한 바퀴(32개 지점) 동안 목표에 도달하지 않음"은 사실이므로 기록한다. "이 버튼은 접근 불가능하다"는 해석이므로 단정하지 않는다. Tab 외 조작(방향키 등)으로 도달할 수 있을 수 있기 때문이다.
테스트 결과: |
  테스트의 성공·실패는 원본 E2E의 assertion 결과를 그대로 따른다. 어떤 관찰 기록도 기본적으로 테스트를 실패시키지 않는다.
  도구를 실패를 판정하는 서비스로 만들지 않는다.
사용자 정의 기준: |
  무엇을 실패로 볼지는 개발자가 원할 때 직접 정한다. 예: "목표에 도달하지 못하면 실패", "Tab 10번을 넘으면 실패".
  도구는 이런 기준을 걸 수 있는 자리만 제공하고 기본값은 비워 둔다. Lighthouse가 측정만 하고 성능 예산(performance budget)은 팀이 정하는 관계와 같다.
  이 기능이 없어도 제품 가치는 유지된다. 기준 설정 방식과 첫 버전 포함 여부는 정하지 않았다.

  구조는 다음과 같다: E2E 실행 → 관찰 → 접근 기록(사실) → Playwright 리포트(사람), 기록 데이터(AI 도구·비교·다른 도구), 사용자 정의 기준(선택) → 테스트 실패 여부. 리포트 구성은 [[기록과 리포트]]가 담당한다.
도달하지 못한 경우: |
  목표에 도달하지 못해도 관찰을 멈추지 않는다. 도달하지 못했다는 사실과 탐색 범위를 기록한 뒤, 원래 E2E 동작(예: 원본 click)으로 대체 실행해 다음 단계로 진행한다.
  한 번의 실행으로 여정 전체의 기록을 얻기 위해서다. 중간에 멈추면 뒤 단계의 상황을 알 수 없고, 하나 고치고 다시 실행해야 다음 상황이 보인다.

  대체 실행 이후 단계의 기록은 "이전 단계를 다른 방법으로 지났다고 가정한 결과"이므로, 대체 실행 이후임을 기록에 표시한다. 대체 실행 직후의 포커스 위치를 어떻게 볼지(목표 요소에 있다고 볼지 등)는 정하지 않았다.
관찰 범위: |
  도구가 지키는 것은 "E2E가 정의한 여정을 다른 방식으로도 끝까지 갈 수 있는가"이다. 키보드 실행 하나로 다음 두 가지를 관찰한다.
  - 도달할 수 있는가
  - 도달해서 키보드로 동작했을 때 E2E의 다음 단계를 이어갈 수 있는가

  그 동작이 원래 무엇을 하는지는 알 필요가 없다. E2E가 정답지이기 때문이다. 그래서 일반 실행은 기록하지 않는다.

  이 도구의 분명한 한계는 다음과 같다.
  - E2E에 없는 시나리오는 관찰할 수 없다.
  - E2E가 확인하지 않는 효과는 잡지 못한다. 예를 들어 hover 때만 나오는 툴팁을 E2E가 확인하지 않으면, 키보드로 볼 수 없어도 드러나지 않는다.

  범위를 넓히는 방법은 E2E 시나리오나 확인을 추가하는 것이고, 추가하면 도구도 자동으로 그만큼 관찰한다.
  도구가 확인할 수 있는 것은 이 단계에서 시도한 키로 이어가지 못했다는 사실까지다. 앱에 다른 방법이 정말 없는지는 증명할 수 없다.
