_codocs:
  id: recording-and-report
  name: 기록과 리포트
  parent:
    - Journey A11y
개요: |
  이 문서는 관찰 기록이 Playwright 안에서 어떻게 만들어지고 전달되며, 개발자에게 어떤 화면으로 보이는지를 정한다.
  별도 리포트 화면을 만들지 않고, Playwright 기본 HTML 리포트 하나에 a11y 결과를 함께 넣는다. 개발자가 새 화면을 배우지 않고 평소 쓰는 리포트에서 결과를 보게 하기 위해서다.
  무엇을 기록하는지는 [[관찰과 판단의 분리:기록하는 것]]이 담당한다.
실행 단위: |
  키보드 경로와 비시각 정보는 한 번의 실행에서 한 벌의 기록으로 남긴다. Tab 지점마다 그 요소의 역할·이름·상태가 함께 붙는다. 모드별로 따로 실행하면 같은 경로를 두 번 밟고 기록을 다시 합쳐야 하기 때문이다.
  실제 스크린 리더는 headed·직렬 실행이 필요해 실행 조건이 다르므로 별도로 둔다([[스크린 리더 모드:제약]]).

  일반 실행은 기록하지 않는다. 키보드 실행 하나로 관찰한다.
기록 전달: |
  워커가 만든 기록은 Playwright 첨부로 리포터까지 전달한다. 워커가 파일을 직접 쓰면 병렬 충돌, 재시도 구분, 샤딩 병합을 직접 만들어야 하기 때문이다.

  관찰 값은 만들어질 때마다 메모리에 쌓고, 단계가 끝나면 첨부하며, fixture 종료 시 전체를 한 번 더 첨부한다.
  2026-11 Playwright 1.64.1 실측 결과 assertion 실패, 타임아웃, 중간 throw에서도 기록이 도착했다. 워커가 강제 종료되면 끝난 단계의 첨부만 남고, 타임아웃이 Tab 탐색 도중에 걸리면 진행 중이던 지점 일부를 잃는다.
  blob 샤딩 후 merge-reports에서 약 1MB 첨부가 그대로 도착했다. 첨부 body는 HTML 리포트 안에 포함되므로 큰 기록은 path로 첨부한다.
리포트 구성: |
  a11y 테스트의 상세 화면을 다음처럼 구성한다.
  - 상단 annotation: `Tab 30 · 이름 없음 2 · 도달 실패 0`처럼 사실만 요약한다.
  - Test Steps: E2E 동작마다 `a11y click: 5 Tab, 이름 없음 1 -> getByRole(...)`을 표시하고, 자식 step에 Tab 지점을 한 줄씩 둔다.
  - 실행 키: 단계 제목에 누른 키와 앞 회차에서 다음 단계가 실패한 키를 적는다. 예: `a11y dblclick → Space · 앞 회차 Enter는 다음 줄 실패`. 그 키로 다음 단계가 통과했는지는 다음 단계의 통과 표시와 `Retry` 탭으로 보이므로 따로 적지 않는다. 다음 단계가 없어 확인하지 못한 경우는 테스트 끝 annotation에 남긴다. 단계를 다음 단계까지 열어 두는 방식은 비공식이고 소요 시간이 섞여서 쓰지 않는다. 2026-11 결정이다.
  - Screenshots: 이름 없음, 도달 실패 같은 사실 조건에 해당하는 지점의 화면만 넣는다. 전체 지점 첨부는 옵션으로 둔다. 위치를 보여 주는 상자를 덧그린 이미지만 두면 앱 자체의 포커스 표시가 가려지므로, 상자 없는 원본 화면도 함께 볼 수 있게 한다.
  - trace: 모든 Tab 지점의 화면과 앱의 실제 포커스 표시를 볼 때 쓴다. 포커스 표시가 보이는지는 첫 버전에서 개발자가 이 화면으로 확인한다([[기록과 리포트:포커스 표시 관찰]]).

  `a11y-report.html` 같은 별도 페이지는 만들지 않는다. 판단이 담긴 "문제", "경고" 같은 표현을 쓰지 않는다([[관찰과 판단의 분리:판단하지 않는 것]]).
일반 테스트 보존: |
  일반 project의 단계, HTML 리포트, trace는 패키지가 없을 때와 같아야 한다. 패치는 a11y project의 워커에만 설치한다.
  설정 파일은 하나만 쓴다. 접근성 실행은 기본으로 꺼져 있고 켤 때만 포함된다. 메커니즘은 [[Playwright 가로채기:도입 방식]]이 담당한다.
  함께 실행하면 같은 리포트에서 테스트는 `chromium`과 `a11y` 표시로 두 줄씩 보이고, `p:a11y`로 거를 수 있다.
trace 포커스 표시: |
  Playwright trace 스냅샷은 DOM 복사본이라 실제 포커스가 없다. 스냅샷은 값, 스크롤 등을 복원하지만 포커스는 복원하지 않으므로 `:focus` 스타일이 적용되지 않는다(1.64.1 소스에서 확인).
  DOM을 바꾸지 않는 adopted stylesheet로 포커스 스타일을 복사하면 앱의 실제 링을 재현할 수 있다. 30개 지점 모두 표시되었고 25곳은 픽셀 차이가 없었다. `::after`, `:focus-within` 등을 위해 `:focus*` 규칙 재작성이 필요하다.

  Tab 지점의 스냅샷은 공개 API인 `locator(':focus').first().describe(...).isVisible()`로 남길 수 있다. getter는 리포트 step을 만들지 않는다. trace viewer에서는 Getters 필터를 켜야 보인다.
한계: |
  - Playwright HTML 리포트에는 공식 UI 확장 API가 없다. 생성된 리포트에 스크립트를 주입하는 방법은 버전과 병합에 취약해 쓰지 않는다.
  - Tab step은 기본으로 접혀 있고 펼친 채 시작할 수 없다. 단계 검색(예: `이름 없음`)으로 찾으면 자동으로 펼쳐진다.
  - step의 이미지는 줄 안에 표시되지 않고, 클립 링크로 같은 페이지의 Screenshots 위치로 이동한다.
  - annotation은 상세 화면에만 보이고 목록에는 보이지 않는다.
  - 전체 요약을 리포트에 붙이는 공개 API는 없다. 필요하면 `a11y summary` 테스트를 추가한다.
  - 이미지는 리포트와 trace에 함께 들어가 용량이 약 2배가 된다. 30장을 모두 넣으면 페이지가 약 16,400px로 길어진다.

  위 내용은 작은 검증 페이지에서 확인했으며 블로그 E2E, Firefox·WebKit, 이 구성의 merge-reports와 재시도는 실행하지 않았다.
JSON 기록: |
  실행이 끝나면 Playwright 리포트와 함께 `a11y-results.json` 파일을 남긴다. AI 코딩 도구에 결과를 전달하고, 수정 전후를 비교하고, 개발자가 직접 기준을 검사할 수 있게 하기 위해서다.
  이 형식은 오픈소스 공개 계약이 된다. 2026-11에 다음과 같이 정했다.

  파일 전체:
  ```json
  {
    "schemaVersion": 1,
    "tool": { "name": "journey-a11y", "version": "0.1.0" },
    "environment": { "playwright": "1.64.1", "browser": "chromium" },
    "tests": [
      {
        "file": "reservation.spec.ts",
        "title": ["예약", "예약을 변경한다"],
        "status": "failed",
        "retry": 1,
        "summary": { "tabs": 32, "unnamed": 2, "unreached": 1 },
        "steps": []
      }
    ]
  }
  ```
  - 버전: `schemaVersion`은 정수다. 필드를 추가할 때는 그대로 두고, 기존 필드의 이름이나 뜻이 바뀔 때만 올린다.
  - 단위: 테스트 → 단계 → Tab 지점. Playwright 리포트와 같은 구조라 서로 찾아가기 쉽다.
  - 회차: 최종 회차만 기록한다. 버린 회차는 `attempts`에 요약되어 있다.
  - 반복: 같은 요소가 여러 단계에 나와도 단계마다 그대로 적는다. 단계 하나만 읽어도 이해할 수 있게 하기 위해서다.
  - 위치: 출력 폴더에 `a11y-results.json` 하나를 남긴다. 병렬 실행과 샤딩에서도 리포터가 하나로 합친다.
  - 약속하는 필드: `reached`, `reachedBy`, `stoppedBy`, `startFocus`, `navigation`, `focusLost`, `path`, `stops`(`index`, `role`, `name`, `nameSource`, `states`, `landmarks`, `heading`, `frame`, `isTarget`), `attempts`(`key`, `source`, `nextStep`, `requests`), `ended`.
  - 버전 1에서 빼는 필드: `focusVisual`, `skipLinks` 동작 결과, `resultChannels`. 고도화 때 추가하며, 추가는 `schemaVersion`을 올리지 않는다.

  한 단계 안에 접근 방식별 칸을 둔다. 같은 E2E 단계의 결과를 바로 비교하고, 나중에 스크린 리더 칸을 추가해도 기존 필드를 바꾸지 않기 위해서다.

  ```json
  {
    "action": "click",
    "target": "button \"예약 변경\"",
    "location": "reservation.spec.ts:3",
    "keyboard": {
      "reached": true,
      "reachedBy": "self",
      "startFocus": "body",
      "path": { "tab": 4, "arrow": 0 },
      "stops": [
        {
          "index": 4,
          "role": "button",
          "name": "예약 변경",
          "nameSource": "contents",
          "states": { "expanded": false },
          "landmarks": ["main"],
          "heading": "h2 3월 12일 예약",
          "isTarget": true
        }
      ],
      "attempts": [
        { "key": "Enter", "source": "role", "nextStep": "continued", "requests": [] }
      ],
      "ended": false
    }
  }
  ```

  고도화 단계에서 `expect` 단계는 결과가 어떤 경로로 전달됐는지 `resultChannels`에 남긴다. 예: `{ "via": "live-region", "role": "status", "politeness": "polite" }`. 전달 경로가 없으면 빈 목록이다.
단계 결과 값: |
  | 필드 | 값 | 뜻 |
  |---|---|---|
  | `reached` | `true` / `false` | 목표에 키보드로 도달했는가 |
  | `path` | `{ tab, arrow }` | 실제로 누른 Tab과 방향키 횟수 ([[키보드 모드:탐색 경로]]) |
  | `navigation` | `load` / `same-document` / 없음 | 앞 단계 뒤 페이지가 바뀐 방식 ([[키보드 모드:동작]]) |
  | `focusLost` | `true` / `false` | 이전에 포커스된 요소가 문서에서 사라져 포커스가 body로 떨어졌는가 |
  | `reachedBy` | `self` / `ancestor` / `label` / `descendant` | 어떤 관계로 도달을 인정했는가 ([[키보드 모드:도달 기준]]) |
  | `stoppedBy` | `round` / `limit` | 도달하지 못했을 때 탐색이 멈춘 이유 ([[키보드 모드:탐색 종료]]) |
  | `skipLinks[]` | `name`, `href`, `firstStopAfter`, `moved`, `via` | 페이지의 건너뛰기 링크 후보별 결과, 고도화 단계 ([[키보드 모드:건너뛰기 링크]]) |
  | `attempts[].key` | 예: `Enter` | 시도한 키 |
  | `attempts[].source` | `declared` / `role` / `generic` | 키를 어디서 알았는가 |
  | `attempts[].nextStep` | `continued` / `not-continued` / `no-next-step` | 그 키로 다음 단계를 이어갔는가 |
  | `attempts[].requests` | 예: `POST /api/delete` | 그 키 뒤에 나간 서버 변경 요청 |
  | `ended` | `true` / `false` | 이 단계에서 키보드 실행이 끝났는가 |

  `unknown` 같은 모호한 값은 쓰지 않는다. 확인하지 못한 이유가 더 생기면 이유가 드러나는 값을 추가한다.

  Tab 지점 필드는 `index`, `role`, `name`, `nameSource`, `states`, `landmarks`, `heading`, `frame`(iframe 안 지점만), `isTarget`을 모두 남긴다. 이미지와 CSS 선택자는 넣지 않는다. 이미지는 리포트 첨부로 따로 있고, 선택자는 코드 변경으로 달라져 수정 전후 비교를 흔들기 때문이다.
포커스 표시 관찰: |
  첫 버전에서는 포커스 표시가 보이는지 자동으로 판단하지 않는다. 경우가 다양해 예외가 계속 늘고, 실제 서비스에서의 판단 보류 비율을 모르며, 지점당 비용이 크기 때문이다. 개발자는 리포트 화면과 trace로 직접 확인한다. 실제 서비스에서 Tab 탐색을 돌려 본 뒤 고도화 단계에서 옵션으로 다시 검토한다. 2026-11 결정이다. 아래는 그때를 위한 설계와 실측 기록이다.

  포커스 표시는 outline, border, 그림자, `::after`, 새 div 등으로 구현될 수 있어 구현 방식을 가정하지 않는다. 포커스 전후의 화면이 실제로 달라졌는지를 사실로 기록한다.

  2026-11 실측 방식은 뷰포트 전체 PNG를 임계값 없이 정확 비교하고, 잡음과 이전 지점 표시가 사라지는 변화를 뺀다. 요소 주변만 비교하면 무관한 변화가 잡혔다.

  제안된 기록 형식은 `{ changed: true|false|null, changedPixels, nearPixels, changedBox, reason, observedMs, covered }`다. `nearPixels`는 아직 구현하지 않았다.
  - `false`는 표시가 없다는 단정이 아니라 `observedMs` 동안 변화가 없었다는 뜻이다.
  - 비교할 수 없으면 `changed`와 `changedPixels`는 `null`이고 `reason`에 `scrolled`, `animated`, `caret`, `offscreen`, `unsettled` 중 이유를 남긴다.

  결과는 318회 중 정답 180, `null` 133, 오답 5였다. 표시가 있는 54회는 모두 맞았다. 오답은 500ms 뒤 나타나는 표시와 1초 시계에서 나왔다. 이 수치는 잡음 사례를 일부러 많이 넣은 단순 페이지 기준이며, 잡음 제거 방식도 이 데이터를 보고 골랐다.

  애니메이션은 끝날 때까지 기다리지 않고 끝 상태로 건너뛴다. Tab 뒤 두 프레임을 기다려 transition이 시작되게 한 뒤, 끝이 있는 애니메이션(같은 출처의 iframe 포함)을 `finish()`로 끝내고 비교한다. 애니메이션을 없애면 애니메이션으로만 그리는 표시가 사라질 수 있으므로 없애지 않는다. 부드러운 스크롤은 애니메이션 객체가 아니어서 움직이는 동안만 기다린다. 2026-11 결정이다.
  - 같은 318회 결과: 정답 214, `null` 97, 오답 7. 표시가 있는 54회는 모두 맞았다. 오답은 JS로 500ms 뒤 띄우는 표시(3), requestAnimationFrame 그림, 1초 시계, 가상 요소 잡음에서 나왔다. JS 지연은 건너뛸 수 없다.
  - 지점당 중앙값 약 241ms(이전 385ms). 내역은 잡음 확인 간격 107, 애니메이션 처리 61, 화면 찍기 44, 해독 24, 비교 22ms다.
  - 잡음 확인 간격을 34ms로 줄이면 약 187ms가 되지만 오답이 17로 늘어 100ms를 유지한다.

  남은 약점은 Tab으로 화면이 스크롤된 지점(모두 판단 보류), 표시 없는 요소 근처의 움직임(판단 보류), JS로 늦게 띄우는 표시(놓침)다. 고도화 때 다룰 질문은 [[열린 질문:포커스 표시 측정 범위]]에 있다.
