_codocs:
  id: prior-art
  name: 선행 사례
  parent:
    - Journey A11y
개요: |
  비슷한 문제를 다루는 기존 도구와 이 도구의 차이를 정리한다. 2026-10 웹 조사 기준이며, 직접 경쟁하는 도구는 추가로 직접 확인해야 한다.
주요 사례: |
  - AEE(Accessibility Evidence Engine): 가장 가깝다. 기존 spec에 fixture를 붙여 페이지 로드 시점마다 키보드 순회와 가상 스크린 리더 기록을 남기고, 실제 VoiceOver·NVDA 비교 워크플로도 있다. 페이지 단위로 전체를 훑는 방식이며 E2E의 각 동작을 키보드 도달로 바꾸지는 않는다.
  - Focus Trail: 테스트 안에 키 입력과 포커스 기대값을 직접 작성하고 기준선과 비교한다. 자동 변환은 하지 않는다.
  - KeyTrail: 기대하는 포커스 순서를 선언해 판정한다.
  - FocusPath: Tab 순회를 시각화하는 보고서를 만든다.
  - Accessibility Insights Tab stops: 수동·반자동 브라우저 확장이며 E2E와 연동되지 않는다.
  - Axe Watcher(Deque), Evinced SDK: 기존 Playwright 흐름 중에 규칙 기반 검사를 하는 상용 도구다. 키보드 경로나 발화는 기록하지 않는다.
  - @axe-core/playwright: 정적 규칙 검사. 상호보완 관계로 둔다([[Journey A11y:제외 범위]]).
차별점: |
  1. 테스트를 수정하지 않는다: 기존 click, fill, expect를 그대로 두고 접근 모드로 실행한다.
  2. E2E 단계 단위로 관찰한다: 페이지 전체 순회가 아니라, 여정의 각 동작에 그 방식으로 어떻게 도달하고 무엇이 전달되는지 기록한다.
  3. 판정하지 않는다: [[관찰과 판단의 분리]].

  비슷한 신생 프로젝트가 2026년 8~10월에 여럿 생겨 계속 지켜볼 필요가 있다.
