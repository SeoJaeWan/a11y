_codocs:
  id: problem-definition
  name: 문제 정의
  parent:
    - Journey A11y
개요: |
  이 문서는 [[Journey A11y]]가 누구의 어떤 문제를 왜 푸는지, 그 문제 정의가 어떤 가정 위에 서 있는지를 설명한다.
  범위나 기능을 판단할 때 이 문서의 문제에 답하는지를 기준으로 삼는다.
출발점: |
  제안자는 프론트엔드 개발자다. 웹 접근성이 중요하다는 것은 알지만, 적용한 접근성 속성이 정답인지 알 수 없었다.
  기존 도구가 무엇을 검사하는지는 알지만, 그 결과가 내 서비스를 실제로 쓸 수 있다는 뜻인지는 알 수 없었다. 직접 시뮬레이션해 보려 해도 환경을 어떻게 구성할지 몰랐다.
  접근성을 중시하기 위해 해야 할 일이 너무 커서 결국 자연스럽게 놓게 되었다.

  E2E 테스트는 모든 곳에 있지는 않지만 비교적 접근하기 쉽다. 특정 요소가 있는지, 클릭하면 어떤 결과가 나오는지 명확하고, 보통 서비스의 메인 시나리오를 다룬다.
  그래서 기존 E2E로 다양한 접근 방식의 사용을 자연스럽게 확인할 수 있지 않을까 하는 생각에서 출발했다. 처음 떠올린 것은 키보드만으로 E2E를 수행할 수 있는지, 그리고 스크린 리더를 쓸 때 가능한지였다.

  제안자 본인이 첫 번째 사용자다.
대상 사용자: |
  접근성을 신경 쓰고 싶지만 전문가는 아닌 프론트엔드 개발자로, Playwright E2E 테스트를 이미 작성하고 있는 사람이다. QA 개발자도 포함할 수 있다.

  이 도구의 최종 수혜자는 키보드, 스크린 리더 등으로 웹을 이용하는 사용자이지만, 도구를 직접 쓰는 사람은 개발자다. 제품은 개발자의 문제를 풀고, 그 결과로 최종 사용자의 문제가 줄어야 한다.
문제: |
  대상 사용자는 접근성 속성을 적용해도 다른 방식으로 접근하는 사용자가 자신의 서비스를 실제로 어떻게 경험하는지 볼 방법이 없다.
  기존 도구는 규칙 위반을 알려줄 뿐 사용 가능성에 답하지 않고, 직접 시뮬레이션하는 비용은 너무 커서 결국 접근성을 포기하게 된다.

  출발점의 세 가지 고충은 다음 구조로 쌓인다.
  - 적용한 속성이 정답인지 모른다: 피드백 루프가 없다.
  - 기존 도구 결과가 실제 사용 가능성을 말해주지 않는다: 규칙 단위 검사와 사용 단위 확인이 어긋난다.
  - 시뮬레이션 환경을 구성할 방법을 모른다: 확인 비용이 크다.
  - 그 결과 해야 할 일이 너무 커서 포기한다.

  핵심 가치는 "문제를 발견한다"보다 "지금 상황을 정확히 볼 수 있다"에 가깝다. 그래서 문제가 없는 경우의 기록도 "내가 한 것이 이렇게 동작한다"는 확인으로서 가치가 있다.
근본 원인: |
  개발팀은 품질을 기능·여정 단위로 관리하지만, 접근성은 규칙 단위로만 검증된다.
  E2E, QA 시나리오, 기획, 이슈는 "사용자가 예약을 변경할 수 있다" 단위로 움직이는데 접근성 도구만 "button-name 규칙 위반 3건" 단위로 말한다.

  이 단위의 불일치 때문에 다음 문제가 생긴다.
  - 여정 단위 확인이 없어서 실제로 막히는 지점을 발견하지 못한다.
  - 기능과 연결되지 않아서 무엇이 중요한지 판단하지 못한다.
  - 사용자 행동으로 설명되지 않아서 이해하기 어렵다.
  - 기존 품질 파이프라인에 들어가지 않아서 고친 뒤에도 유지되지 않는다.

  그래서 기존 E2E 재사용은 목표가 아니라, 접근성을 여정 단위로 옮겨오는 비용을 0에 가깝게 만드는 수단이다.
해결 방향: |
  기존 E2E 시나리오를 다른 접근 방식으로 재실행하고, 각 단계에서 목표에 어떻게 도달했는지(경로, 입력 횟수, 각 지점에서 전달되는 정보, 다음 단계를 이어갈 수 있었는지)를 기록해 보여준다.
  문제인지 아닌지의 판단은 개발자에게 맡기고 도구는 정확한 관찰을 제공한다. 이 원칙과 관찰 범위는 [[관찰과 판단의 분리]]가 담당한다.
  어떤 접근 방식으로 관찰하는지는 [[접근 모드]]에서 정한다.
전제 가정: |
  이 문제 정의는 다음 가정에 기대며, 검증이 필요하다.
  - 대상 팀에 핵심 여정을 다루는 E2E가 이미 있다. E2E가 거의 없는 팀은 1차 대상이 아니다.
  - 키보드나 비시각 접근에서 여정이 막히거나 정보가 전달되지 않는 경우가 실제로 흔하다.
  - 개발자가 기록을 보면 상황을 이해하고 행동할 수 있다.
  - E2E가 지나가는 경로가 사용자의 핵심 경로와 겹친다. E2E는 주로 정상 경로를 다루므로 오류 상태, 빈 상태 등은 관찰 범위 밖이며, 이는 한계로 명시한다.

  초기 확인 방법으로 다음을 검토했다.
  - 추가 테스트 작성 없이 적용 가능한지: 기존 Playwright 테스트에 적용해 추가 작업량을 본다.
  - 기존 E2E가 드러내지 못하는 상황을 보여주는지: 의도적으로 문제를 넣은 페이지로 확인한다. [[테스트베드]]
  - 개발자가 기록만 보고 상황을 이해하는지: 탐색 경로와 단계 기록만으로 원인을 파악할 수 있는지 본다.
  - 수정 전후 변화를 볼 수 있는지: 같은 시나리오를 수정 전후로 실행해 기록을 비교한다.
