_codocs:
  id: testbeds
  name: 테스트베드
  parent:
    - Journey A11y
개요: |
  도구가 정확히 관찰하는지 확인할 실제 서비스와 검증용 페이지를 정한다.
  두 역할을 나눈다. 잘 만든 서비스에서 "정상인 것을 정상으로 정확히 기록하는가", 의도적으로 문제를 넣은 페이지에서 "빠진 것을 빠진 것으로 드러내는가"를 본다.
실 서비스: |
  구현한 도구를 실제 서비스의 E2E에 직접 붙여 써 보고 피드백을 얻는다. 코드를 잘 아는 서비스를 쓰면 기록을 보고 맞는 관찰인지 바로 판단할 수 있다.
  실제 서비스는 이 저장소의 테스트나 CI에 넣지 않는다. 피드백에서 나온 새 상황은 [[테스트 작성 규칙:실사용 상황 목록]]에 더하고 도구 동작을 정한 뒤 E2E 시나리오 케이스로 만든다. 2026-11 결정이다.
검증용 페이지: |
  일반 웹 형태이면서 의도적으로 문제를 넣은 두 번째 테스트베드를 둔다. 그 페이지에 대한 평범한 E2E는 일반 실행에서 모두 통과해야 한다.
  후보 패턴: onClick만 있는 div 버튼, tabindex=-1 버튼, 포커스를 옮기지 않는 모달, 방향키로 이동하는 탭(정상 동작 확인용), 이름 없는 아이콘 버튼, placeholder만 있는 입력, live region 유무가 다른 성공 메시지.
  이 모음은 회귀 테스트, 데모, README 예제로도 쓴다. 구체 목록은 정하지 않았다.
