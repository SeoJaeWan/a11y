_codocs:
  id: testbeds
  name: 테스트베드
  parent:
    - Journey A11y
개요: |
  도구가 정확히 관찰하는지 확인할 실제 서비스와 검증용 페이지를 정한다.
  두 역할을 나눈다. 잘 만든 서비스에서 "정상인 것을 정상으로 정확히 기록하는가", 의도적으로 문제를 넣은 페이지에서 "빠진 것을 빠진 것으로 드러내는가"를 본다.
블로그: |
  제안자의 블로그(https://github.com/SeoJaeWan/seojaewan-blog)를 첫 실 서비스 테스트베드로 쓴다. 제안자가 코드를 모두 알기 때문에 기록을 보고 맞는 관찰인지 즉시 판단할 수 있다.

  쓰임: 블로그는 이 저장소의 테스트나 CI에 넣지 않는다. 구현한 뒤 제안자가 블로그에 직접 써 보고 피드백을 주는 용도다. 피드백에서 나온 새 상황은 [[테스트 작성 규칙:실사용 상황 목록]]에 더하고 도구 동작을 정한 뒤 E2E 시나리오 케이스로 만든다. 2026-11 결정이다.

  2026-10-29 기준 분석(설치·실행 없이 읽기만 함):
  - pnpm 모노레포, Next.js 16 App Router, React 19, Tailwind 4, Base UI(Menu, Dialog).
  - Playwright E2E(`apps/web/e2e`), CI에서 실행. 2026-11 기준 파일 15개, 테스트 41개다. 로케이터는 거의 역할 기반이라 도구가 목표를 이해하기 좋다.
  - 화면 전체가 Windows 11 데스크톱을 흉내 낸다(바탕화면 아이콘, 작업 표시줄, 시작 메뉴, 탐색기, 글을 띄우는 브라우저 창). roving tabindex 목록, 메뉴, 대화상자, 포커스 트랩, 탭, combobox, 포커스 복귀 로직이 있다.
  - 로컬 실행은 쉬운 편이다(환경 변수·외부 API·DB 없음, build 후 start). 상태가 localStorage에 남으므로 테스트마다 새 context가 필요하다.

  관찰 첫 후보 시나리오: 시작 메뉴 검색 → 방향키 → Enter로 글 열기(키보드 친화적 기준선), 브라우저 창 Ctrl+F 찾기와 메뉴, 창 최소화·최대화·닫기, 바탕화면 새 폴더 → 이름 바꾸기 → 삭제, 폴더 더블클릭 → 탐색기.
블로그의 한계: |
  - 접근성 규율이 이미 잘 지켜져 있어 "잘 만든 앱의 기준선" 역할을 하며 문제 사례는 적게 나올 수 있다.
  - 데스크톱 OS 메타포라 일반적인 웹사이트(링크, 목록, 글, 폼)를 대표하지 못한다.
  - dblclick 13회, 우클릭 5회, hover, 드래그 등 포인터 전용 단계가 많다. 이 점이 [[키보드 모드:실행 키 선택]]의 설계로 이어졌다.
  - `aria-keyshortcuts`를 쓰지 않아 dblclick 단계는 역할 관례로 시도하게 된다.
  - 접근 가능한 이름이 한국어라 스크린 리더 발화 확인 시 로케일을 고려해야 한다.
검증용 페이지: |
  일반 웹 형태이면서 의도적으로 문제를 넣은 두 번째 테스트베드를 둔다. 그 페이지에 대한 평범한 E2E는 일반 실행에서 모두 통과해야 한다.
  후보 패턴: onClick만 있는 div 버튼, tabindex=-1 버튼, 포커스를 옮기지 않는 모달, 방향키로 이동하는 탭(정상 동작 확인용), 이름 없는 아이콘 버튼, placeholder만 있는 입력, live region 유무가 다른 성공 메시지.
  이 모음은 회귀 테스트, 데모, README 예제로도 쓴다. 구체 목록은 정하지 않았다.
