_codocs:
  id: open-questions
  name: 열린 질문
  parent:
    - Journey A11y
개요: |
  아직 정하지 않은 설계 결정을 모은다. 결정되면 담당 문서로 내용을 옮기고 여기서는 지운다.

  다음 논의는 [[열린 질문:키보드 탐색 규칙]]부터 시작한다.
기록 데이터 모델: |
  확정한 구조는 [[기록과 리포트:JSON 기록]]과 [[기록과 리포트:단계 결과 값]]에 있다. 전체 JSON 스키마, 버전 표기, 공개 계약에 포함할 필드, 요소 단위 사실과 여정 단위 사실의 구분이 남아 있다.
사용자 정의 기준: |
  기준을 거는 방식(config, API)과 첫 버전 포함 여부. [[관찰과 판단의 분리:사용자 정의 기준]]
브라우저 지원 범위: |
  비시각 정보 모드가 CDP(Chromium 전용)에 기대므로 Firefox·WebKit을 어떻게 다룰지.
저장소 구조: |
  패키지 경계, 모노레포 구성, 검증용 페이지와 예제의 위치, 툴링.
문장 안내 해석: |
  `aria-describedby` 문장 안내에서 정규식으로 키 단어만 뽑아 쓸지. AI 해석은 아니지만 문장을 일부 해석하는 셈이다. [[키보드 모드:실행 키 선택]]
지원 버전: |
  지원할 Playwright 버전 범위. [[Playwright 가로채기:내부 API 의존]]
포커스 표시 측정 범위: |
  고도화 단계의 질문이다. 첫 버전에서는 자동 판단을 하지 않는다. 스크롤된 지점과 JS 지연 표시를 어떻게 다룰지, 그리고 지점당 약 241ms가 드는 포커스 표시 관찰을 언제 실행할지. 항상 켤지, 같은 요소는 한 번만 잴지, 끄는 옵션을 둘지 정한다. 같은 페이지·role·이름·DOM 위치·상태가 같은 요소의 결과를 재사용하는 안이 제안되었다. [[기록과 리포트:포커스 표시 관찰]]
키보드 탐색 규칙: |
  탐색 방식은 [[키보드 모드:탐색 경로]], 도달 기준은 [[키보드 모드:도달 기준]], 종료 조건은 [[키보드 모드:탐색 종료]], 블록 이동은 [[키보드 모드:건너뛰기 링크]]로 결정했다. 실제 UI 라이브러리와 블로그 E2E에서의 확인이 남아 있다. [[열린 질문:실측 검증]]
실측 검증: |
  지금까지의 수치는 작은 검증 페이지 기준이다. 블로그 E2E 26개에서 실행 시간, 값을 내지 못하는 비율, Tab 지점 수를 재야 한다. 독립 실행, 포커스 측정, 다음 단계 확인의 판단 근거가 된다. [[테스트베드:블로그]]
재실행 구현: |
  독립 실행은 [[키보드 모드:독립 실행]]으로, 재실행은 [[키보드 모드:재실행 방식]]의 Playwright 재시도로 결정했다. 여기에는 비교 근거와 남은 확인 사항을 둔다.

  2026-11 실측(Playwright 1.64.1, 작은 검증 페이지, 워커 2개). 추측 없음, 첫 키 성공, 둘째 키 성공, 키 전부 실패, 진짜 실패를 비교했다. 당시 시험은 후보를 다 쓰면 원래 동작을 실행하는 구성이었다.
  - Playwright 재시도(프로젝트 `retries: 2`): 각각 1, 1, 2, 3회로 끝났고 `beforeEach`와 fixture가 회차마다 다시 돌았다. import 변경은 없었다. 터미널에 버린 회차의 오류가 찍히고 테스트는 `flaky`로 표시된다. 종료 코드는 0이다. 진짜 실패도 3회 돌고 실패로 남는다.
  - 재시도 + 진짜 실패의 재시도를 skip으로 생략: 실패가 `flaky`로 바뀌어 가려진다. 쓰면 안 된다.
  - skip + 의존 프로젝트: 버린 회차를 실패 없이 skip으로 끝내지만, 진짜 실패가 하나라도 있으면 뒤 프로젝트 전체가 실행되지 않는다. 회차 수만큼 프로젝트가 필요하고 리포트에 skipped 행이 늘어난다.
  - skip + teardown 프로젝트: 같은 조건에서 뒤 프로젝트가 실행되지 않았다.

  진짜 실패가 있어도 재실행이 동작한 방법은 재시도뿐이다. 대신 버린 회차가 실패로 보이고 테스트가 `flaky`로 표시된다.

  이전 실측:
  - `test` 래퍼 재호출은 `beforeEach`와 fixture가 다시 돌지 않았고 import 변경이 필요했다.
  - 브라우저 상태 복원은 서버 상태를 되돌리지 못했다. 임시 브라우저 시험은 일부 키를 학습하지 못했다.
  - 데이터 초기화가 없는 경우는 모든 방식에서 복구되지 않았고, a11y 실행 뒤 일반 테스트도 타임아웃이 났다.
  - 고유 주문 요청은 재실행에서 409로 실패했고, 메일은 최대 3회 발송되었다.

  남은 질문:
  - 실행을 끝내기로 한 테스트의 남은 재시도를 어떻게 처리할지. skip으로 끝내면 `flaky`가 되어 실패가 가려지므로, 남은 재시도를 시작 직후 같은 사실로 실패시키는 방식을 검토한다. 시험하지 않았다.
  - 사용자가 설정한 `retries`와의 관계, `--fail-on-flaky-tests`를 쓰는 CI에서의 동작은 시험하지 않았다.
  - 틀린 키의 서버 변경이 실제로 얼마나 생기는지 블로그 E2E에서 세어 본다. 자주 생기면 요청 차단을 다시 검토한다. [[키보드 모드:재실행 전제]]
  - 키에 아무 반응이 없을 때 재실행 없이 같은 회차에서 다음 키를 눌러도 되는지. 재실행을 줄이지만 반응 없음을 믿을 수 있어야 한다.
  - 오답이 다음 단계보다 뒤에서 드러나는 경우와 병렬 워커·공유 서버 조합은 시험하지 않았다.
드래그 대체 수단: |
  E2E의 `dragTo`에 키보드나 단일 포인터 대체 수단이 있는지 관찰할 방법. 지금은 키 관례가 없는 동작으로 보고 그 단계에서 실행을 끝낸다([[키보드 모드:실행 키 선택]]).

  드래그 시작 요소의 포커스 가능 여부, role, `aria-roledescription`, `aria-keyshortcuts`, `aria-describedby` 문장은 기록할 수 있다. 별도 버튼이나 메뉴 같은 대체 수단은 E2E에 없으면 연결할 근거가 없다. Space·방향키·Space 순서를 후보로 시도할지는 실측하지 않았다.
