_codocs:
  id: open-questions
  name: 열린 질문
  parent:
    - Journey A11y
개요: |
  아직 정하지 않은 설계 결정을 모은다. 결정되면 담당 문서로 내용을 옮기고 여기서는 지운다.

  2026-11 케이스를 모두 쓰면서 기록 형식의 빈칸이 드러났다. 구현 전에 [[열린 질문:결과 전달 경로의 버전 1 포함]], [[열린 질문:기록 형식 빈칸]], [[열린 질문:실행기 확장]], [[열린 질문:정하지 않은 동작]]을 하나씩 정한다. 지금 케이스의 기대값은 각 섹션의 "지금 가정"대로 쓰여 있어, 결정이 다르면 기대값도 함께 고친다.

  그 밖의 버전 1 설계는 정했다. 버전 1 범위는 [[Journey A11y:버전 1 범위]], 지원 버전은 [[Playwright 가로채기:지원 버전]], 저장소 구조는 [[Journey A11y:배포 형태]], 기록 형식은 [[기록과 리포트:JSON 기록]]에 있다. 남은 항목은 고도화 단계의 질문이거나 구현하면서 확인할 사항이다([[열린 질문:재실행 구현]], [[열린 질문:실측 검증]]).
사용자 정의 기준: |
  기준을 거는 방식(config, API)과 첫 버전 포함 여부. [[관찰과 판단의 분리:사용자 정의 기준]]
문장 안내 해석: |
  `aria-describedby` 문장 안내에서 정규식으로 키 단어만 뽑아 쓸지. AI 해석은 아니지만 문장을 일부 해석하는 셈이다. [[키보드 모드:실행 키 선택]]
포커스 표시 측정 범위: |
  고도화 단계의 질문이다. 첫 버전에서는 자동 판단을 하지 않는다. 스크롤된 지점과 JS 지연 표시를 어떻게 다룰지, 그리고 지점당 약 241ms가 드는 포커스 표시 관찰을 언제 실행할지. 항상 켤지, 같은 요소는 한 번만 잴지, 끄는 옵션을 둘지 정한다. 같은 페이지·role·이름·DOM 위치·상태가 같은 요소의 결과를 재사용하는 안이 제안되었다. [[기록과 리포트:포커스 표시 관찰]]
키보드 탐색 규칙: |
  탐색 방식은 [[키보드 모드:탐색 경로]], 도달 기준은 [[키보드 모드:도달 기준]], 종료 조건은 [[키보드 모드:탐색 종료]], 블록 이동은 [[키보드 모드:건너뛰기 링크]]로 결정했다. 실제 UI 라이브러리와 실제 서비스 E2E에서의 확인이 남아 있다. [[열린 질문:실측 검증]]
실측 검증: |
  지금까지의 수치는 작은 검증 페이지 기준이다. 실제 서비스 E2E에서 실행 시간, 값을 내지 못하는 비율, Tab 지점 수를 재야 한다. 독립 실행, 포커스 측정, 다음 단계 확인의 판단 근거가 된다. [[테스트베드:실 서비스]]
재실행 구현: |
  독립 실행은 [[키보드 모드:독립 실행]]으로, 재실행은 [[키보드 모드:재실행 방식]]의 Playwright 재시도로 결정했다. 여기에는 비교 근거와 남은 확인 사항을 둔다.

  2026-11 실측(Playwright 1.64.1, 작은 검증 페이지, 워커 2개). 추측 없음, 첫 키 성공, 둘째 키 성공, 키 전부 실패, 진짜 실패를 비교했다. 당시 시험은 후보를 다 쓰면 원래 동작을 실행하는 구성이었다.
  - Playwright 재시도(프로젝트 `retries: 2`): 각각 1, 1, 2, 3회로 끝났고 `beforeEach`와 fixture가 회차마다 다시 돌았다. import 변경은 없었다. 터미널에 버린 회차의 오류가 찍히고 테스트는 `flaky`로 표시된다. 종료 코드는 0이다. 진짜 실패도 3회 돌고 실패로 남는다.
  - 재시도 + 진짜 실패의 재시도를 skip으로 생략: 실패가 `flaky`로 바뀌어 가려진다. 쓰면 안 된다.
  - skip + 의존 프로젝트: 버린 회차를 실패 없이 skip으로 끝내지만, 진짜 실패가 하나라도 있으면 뒤 프로젝트 전체가 실행되지 않는다. 회차 수만큼 프로젝트가 필요하고 리포트에 skipped 행이 늘어난다.
  - skip + teardown 프로젝트: 같은 조건에서 뒤 프로젝트가 실행되지 않았다.

  진짜 실패가 있어도 재실행이 동작한 방법은 재시도뿐이다. 대신 버린 회차가 실패로 보이고 테스트가 `flaky`로 표시된다.

  이전 실측:
  - `test` 래퍼 재호출은 `beforeEach`와 fixture가 다시 돌지 않았고 import 변경이 필요했다.
  - 브라우저 상태 복원은 서버 상태를 되돌리지 못했다. 임시 브라우저 시험은 일부 키를 학습하지 못했다.
  - 데이터 초기화가 없는 경우는 모든 방식에서 복구되지 않았고, a11y 실행 뒤 일반 테스트도 타임아웃이 났다.
  - 고유 주문 요청은 재실행에서 409로 실패했고, 메일은 최대 3회 발송되었다.

  남은 질문:
  - 실행을 끝내기로 한 테스트의 남은 재시도를 어떻게 처리할지. skip으로 끝내면 `flaky`가 되어 실패가 가려지므로, 남은 재시도를 시작 직후 같은 사실로 실패시키는 방식을 검토한다. 시험하지 않았다.
  - 사용자가 설정한 `retries`와의 관계, `--fail-on-flaky-tests`를 쓰는 CI에서의 동작은 시험하지 않았다.
  - 틀린 키의 서버 변경이 실제로 얼마나 생기는지 실제 서비스 E2E에서 세어 본다. 자주 생기면 요청 차단을 다시 검토한다. [[키보드 모드:재실행 전제]]
  - 키에 아무 반응이 없을 때 재실행 없이 같은 회차에서 다음 키를 눌러도 되는지. 재실행을 줄이지만 반응 없음을 믿을 수 있어야 한다.
  - 오답이 다음 단계보다 뒤에서 드러나는 경우와 병렬 워커·공유 서버 조합은 시험하지 않았다.
드래그 대체 수단: |
  E2E의 `dragTo`에 키보드나 단일 포인터 대체 수단이 있는지 관찰할 방법. 지금은 키 관례가 없는 동작으로 보고 그 단계에서 실행을 끝낸다([[키보드 모드:실행 키 선택]]).

  드래그 시작 요소의 포커스 가능 여부, role, `aria-roledescription`, `aria-keyshortcuts`, `aria-describedby` 문장은 기록할 수 있다. 별도 버튼이나 메뉴 같은 대체 수단은 E2E에 없으면 연결할 근거가 없다. Space·방향키·Space 순서를 후보로 시도할지는 실측하지 않았다.
결과 전달 경로의 버전 1 포함: |
  `expect` 단계에 결과가 화면을 보지 않는 사용자에게 어떤 길로 전달됐는지(`resultChannels`)를 버전 1부터 남길지. 2026-11 케이스 논의에서 다시 나온 질문이다. 지금은 [[기록과 리포트:JSON 기록]]에서 버전 1에서 빼는 필드로 정해져 있다.

  예: "예약이 확정되었습니다"가 `role="status"` 안에 나타나면 `[{ "via": "live-region", "role": "status", "politeness": "polite" }]`, 메시지로 포커스가 옮겨가면 `[{ "via": "focus" }]`, 그냥 `<p>`로 나타나면 `[]`(전달 경로 없음). 원래 E2E의 `toBeVisible`·`toHaveText`는 세 경우 모두 통과하므로 이 차이는 이 칸에만 드러난다.
  - 넣는 쪽: 도구가 묻는 "보지 않고도 무슨 일이 일어났는지 알 수 있는가"의 핵심이다. 2026-10 실측에서 세 경우를 구분했고 비용은 테스트당 약 0.1초였다([[비시각 정보 모드:실현 근거]]).
  - 미루는 쪽: 늦게 나타나는 메시지를 잡으려면 페이지가 열릴 때 감시 스크립트(MutationObserver, focusin)를 심어 변화를 계속 적어야 해 구현이 늘어난다([[비시각 정보 모드:설계 결정과 근거]]).
기록 형식 빈칸: |
  케이스를 쓰며 [[기록과 리포트:JSON 기록]]이 정하지 않은 부분이다. 지금 케이스는 "지금 가정"대로 쓰여 있다. 2026-11 `expect`를 단계로 넣는 것은 정했다([[기록과 리포트:JSON 기록]]).
  1. 상태 값의 false: Chromium이 주는 값을 그대로 두고(`readonly: false`, `required: false`) 모든 컨트롤에 붙는 `invalid: false`만 뺐다. 참인 값만 남길지, 페이지가 명시한 값만 남길지 정한다.
  2. Tab 횟수 세는 법: 마지막 요소 뒤 페이지 밖으로 나가는 누름은 `path.tab`에 세고 지점으로는 적지 않았다. 한 바퀴는 처음 지점으로 돌아오는 누름까지 센다. 그래서 body에서 시작해 n개를 지나 도달하지 못하면 `tab`은 n + 2다.
  3. 실패로 끝난 테스트의 `retry`: 키를 모두 써도 이어지지 않은 케이스는 마지막 키가 실패한 회차 번호(예: Enter, Space면 1)로 적은 것과 비교에서 뺀 것이 섞여 있다. 남은 재시도 처리([[열린 질문:재실행 구현]])와 함께 정한다.
  4. 키 기록:
     - `fill`과 방향키로 도착해 이미 선택된 라디오는 `attempts: []`로 적었다.
     - E2E가 키를 정한 `press`는 `source`(declared/role/generic)에 맞는 값이 없어 비교에서 뺐다.
     - `selectOption`은 닫는 Enter만 `attempts`에 있고 여는 Space와 고르는 ↓는 기록에 없다. 여러 개 선택의 Ctrl+Space도 정하지 않았다.
  5. 넣을 칸이 없는 사실:
     - 색 선택 창: "값은 원래 방식으로 넣음"과 창을 연 Enter
     - 라디오: 지나가며 선택된 항목(지금은 지난 지점의 `checked: true`로만 보인다)
     - 파일 업로드 추측: 여는 버튼을 추측해 성공했을 때의 `reachedBy` 값(지금은 비움)과 어떤 요소가 파일 창을 열었는지
     - 기다림: 목표가 준비될 때까지 기다린 시간
     - `selectOption`: `change`가 한 번 일어났다는 사실
  6. `target` 문자열: `역할 "이름"`, 이름이 없으면 역할만 쓴다. Chromium 고유 역할 이름(`DateTime`, `ColorWell`, 포커스 없는 `span`의 `generic`)을 그대로 썼다. 좌표 동작은 `좌표 (x, y) → button "저장" (좌표로 추정)`이다.
  7. iframe 안 지점의 `landmarks`와 `heading`: E2E 케이스는 프레임 문서 기준으로 적었고(바깥 `main`은 넣지 않음) 공통 조각은 비교에서 뺐다. 기준을 하나로 정한다.
  8. 실패로 끝난 단계 뒤: 실행이 끝난 단계 다음의 단계는 기록하지 않았다.
실행기 확장: |
  지금 실행기는 `a11y-results.json`의 테스트 기록만 비교하고 기록이 있어야만 비교한다. 그래서 다음 값은 공통 조각에서 케이스 대신 `noCase` 이유("실행기가 아직 확인하지 못함: ...")로 남겼다. 실행기를 넓힐지, 언제 넓힐지 정한다.
  - 켜고 끄기: `A11Y` 없음(기록이 없어야 함), `--project=a11y`(케이스별 명령줄 인자), 패키지 없는 실행과 비교(일반 project의 단계·trace가 같은지), 지원 범위 밖 버전(CI의 다른 버전 설치와 경고 확인)
  - 결과 남기기: 리포트 단계 제목과 자식 단계, 실행 키와 앞 회차 실패 키, 요약·"다음 단계 없음" annotation, 이미지 첨부, 도달 못 함·재실행 메시지, 재실행 전제 힌트, trace의 Tab 지점 스냅샷, JSON 파일 머리(`schemaVersion`, `tool`, `environment`), 버전 1에서 빼는 필드가 없는지
  - 필요한 기능: 안쪽 Playwright JSON 리포트(`report.json`)의 단계·annotation·첨부·오류를 회차별로 읽기, "기록이 없어야 한다"는 기대 표기, 케이스별 명령줄 인자
정하지 않은 동작: |
  문서가 도구의 동작을 정하지 않아 케이스를 두지 않은 값이다.
  - Quill·TipTap 같은 편집기: 시험용 앱에 라이브러리가 없다. 입력 방법은 `contenteditable` 케이스와 같다.
  - `page.mouse.wheel`, 끌기(`down` → `move` → `up`): 단계 기록 모양과 몇 단계로 셀지
  - 가상 스크롤 목록 항목: 목표가 아직 DOM에 없을 때 남길 값
  - `ElementHandle.click`: 가로채기에서 잡히지 않을 때 도구가 할 일
  - 공통 조각의 다른 출처 iframe: 시험용 앱의 5175 포트 서버가 생겼으므로 이제 케이스로 만들 수 있다.
