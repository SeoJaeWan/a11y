_codocs:
  id: open-questions
  name: 열린 질문
  parent:
    - Journey A11y
개요: |
  아직 정하지 않은 설계 결정을 모은다. 결정되면 담당 문서로 내용을 옮기고 여기서는 지운다.

  다음 논의는 [[열린 질문:독립 실행 여부]]부터 시작한다. 도구가 사용자의 데이터나 E2E 흐름을 바꿀 수 있는 문제이고, 나머지 결정의 전제가 되기 때문이다.
기록 데이터 모델: |
  확정한 구조는 [[기록과 리포트:JSON 기록]]과 [[기록과 리포트:단계 결과 값]]에 있다. 전체 JSON 스키마, 버전 표기, 공개 계약에 포함할 필드, 요소 단위 사실과 여정 단위 사실의 구분이 남아 있다.
대체 실행 이후 상태: |
  목표에 도달하지 못해 원본 동작으로 대체 실행한 뒤의 포커스 위치를 어떻게 정하고 기록에 어떻게 표시할지. [[관찰과 판단의 분리:도달하지 못한 경우]]
사용자 정의 기준: |
  기준을 거는 방식(config, API)과 첫 버전 포함 여부. [[관찰과 판단의 분리:사용자 정의 기준]]
브라우저 지원 범위: |
  비시각 정보 모드가 CDP(Chromium 전용)에 기대므로 Firefox·WebKit을 어떻게 다룰지.
저장소 구조: |
  패키지 경계, 모노레포 구성, 검증용 페이지와 예제의 위치, 툴링.
문장 안내 해석: |
  `aria-describedby` 문장 안내에서 정규식으로 키 단어만 뽑아 쓸지. AI 해석은 아니지만 문장을 일부 해석하는 셈이다. [[키보드 모드:실행 키 선택]]
다음 단계 결과 표시: |
  `Enter 실행 → 다음 단계 계속됨` 줄을 표시하려면 부모 step을 다음 단계까지 열어 둬야 한다. 비공식 패턴이고 소요 시간이 부정확하다. 이 방식을 쓸지.
지원 버전: |
  지원할 Playwright 버전 범위. [[Playwright 가로채기:내부 API 의존]]
독립 실행 여부: |
  첫 버전에서 키 시도를 독립 실행할지 정한다. 재실행 방법을 고르기 전에 필요 여부부터 판단한다.

  독립 실행이 필요한 이유는 도구가 정답을 모르는 키를 추측해서 누르기 때문이다. 버튼 click의 Enter나 fill의 타이핑은 필요 없고, 안내 없는 dblclick, 우클릭처럼 추측이 필요한 단계에서만 문제가 된다. 키에 아무 반응이 없으면 상태가 바뀌지 않으므로 문제가 되지 않는다.

  잘못된 키의 결과는 세 가지다.
  - 아무 일도 없음: 다음 키나 원래 동작으로 진행한다.
  - 되돌릴 수 있는 다른 일: Escape 후 진행한다.
  - 되돌릴 수 없는 일: 이어갈 수 없다.

  선택지:
  - 독립 실행 안 함: E2E를 한 번만 순서대로 실행한다. 단순하고 빠르다. 잘못된 키가 삭제 같은 일을 하면 그 테스트는 이어가지 못하고 원인을 기록한다. 첫 버전은 이 방식으로 시작하고 블로그에서 실제 영향을 본 뒤 다시 판단하는 안이 추천되었다.
  - 독립 실행 함: 추측이 필요한 테스트를 시도마다 처음부터 다시 실행한다. 영향은 줄지만 구조가 복잡해지고 시간이 늘어난다.

  독립 실행을 한다면 재실행 방식은 사전 탐색 실행이 가장 유력했다. 탐색 후 본 실행은 찾은 키로 한 번만 돈다. 2026-11 실측 결과는 다음과 같다.
  - 사전 탐색, Playwright 재시도, `test` 래퍼 재호출은 재초기화가 있는 경우를 독립적으로 통과했다.
  - 재시도는 터미널에 실패가 찍히고 우회가 필요했다. 재호출은 `beforeEach`와 fixture가 다시 돌지 않았고 import 변경이 필요했다.
  - 브라우저 상태 복원은 서버 상태를 되돌리지 못했다. 임시 브라우저 시험은 일부 키를 학습하지 못했다.
  - 데이터 초기화가 없는 경우는 모든 방식에서 복구되지 않았고, a11y 실행 뒤 일반 테스트도 타임아웃이 났다.
  - 고유 주문 요청은 재실행에서 409로 실패했고, 메일은 최대 3회 발송되었다.

  시도 뒤의 상태 오염은 `target-missing`, `failed-before-decision-step`, `fallback-failed` 같은 사실과 변경 요청(예: `POST /api/delete`)으로 기록할 수 있다. 오염된 테스트를 실패로 둘지 확인 불가로 표시할지도 정해야 한다. 오답이 다음 단계보다 뒤에서 드러나는 경우와 병렬 워커·공유 서버 조합은 시험하지 않았다.
포커스 표시 측정 범위: |
  지점당 약 385ms가 드는 포커스 표시 관찰을 언제 실행할지. 항상 켤지, 일부 지점만 잴지, 옵션으로 둘지 정한다. [[기록과 리포트:포커스 표시 관찰]]
키보드 탐색 규칙: |
  복합 위젯의 방향키 탐색, 포커스가 목표의 자식에 갔을 때의 도달 기준, 탐색 종료 조건. [[키보드 모드:설계 고려 사항]]
실측 검증: |
  지금까지의 수치는 작은 검증 페이지 기준이다. 블로그 E2E 26개에서 실행 시간, 값을 내지 못하는 비율, Tab 지점 수를 재야 한다. 독립 실행, 포커스 측정, 다음 단계 확인의 판단 근거가 된다. [[테스트베드:블로그]]
