_codocs:
  id: journey-a11y
  name: Journey A11y
개요: |
  Journey A11y(가칭)는 이미 작성된 Playwright E2E 테스트를 다른 접근 방식(키보드, 비시각 정보, 스크린 리더)으로 다시 실행하고, 각 단계에서 그 방식의 사용자가 무엇을 경험하는지 기록해 보여주는 오픈소스 개발자 도구다.
  이 문서는 제품의 정체성과 원칙, 배포 형태, 제외 범위를 정하고 세부 문서가 답하는 질문을 안내한다.

  핵심 메시지: 기존 Playwright E2E 테스트로, 다른 방식으로 접근하는 사용자가 실제 여정을 어떻게 경험하는지 확인한다. 새로운 테스트 시나리오는 필요하지 않다.
제품 원칙: |
  - 기존 E2E 재사용: 접근성 확인을 위해 새 시나리오를 작성하지 않는다. 테스트 코드는 수정하지 않거나 최소한만 수정한다. E2E 재사용은 목표가 아니라 수단이며, 목표는 접근성을 개발팀이 이미 관리하는 단위(여정)로 옮겨오는 것이다. 근거는 [[문제 정의:근본 원인]]에 있다.
  - 판정이 아니라 관찰: 도구는 문제 여부를 판정하지 않고 일어난 일을 기록한다. 문제로 삼을지는 개발자가 정한다. 세부 규칙은 [[관찰과 판단의 분리]]가 담당한다.
  - 정직한 기록: 시도한 것과 시도하지 않은 것, 측정의 한계를 구분해 남긴다. 확인하지 못한 것을 확인한 것처럼 기록하지 않는다.
  - 설정 0에 가까운 도입: 환경 구성 부담 자체가 사용자가 접근성을 포기하게 된 원인이므로([[문제 정의:문제]]), 설치하고 기존 테스트를 돌리면 결과가 나와야 한다.
  - AI 의존성 없음: 자체 AI 모델이나 웹사이트를 임의로 탐색하는 에이전트를 만들지 않는다. 같은 입력에는 같은 기록이 나와야 한다.
배포 형태: |
  오픈소스 Playwright 확장 패키지로 시작한다. 별도 웹서비스나 브라우저 확장 프로그램보다 진입 장벽이 낮고, 기존 E2E 테스트와 CI에 자연스럽게 들어가기 때문이다.
  패키지 이름은 정하지 않았다. 지금까지 가칭으로 `@journey-a11y/playwright`를 사용했다.

  오픈소스가 목표이므로 다음이 요구 사항이 된다.
  - 처음 5분 경험: 설치하고 기존 E2E 하나를 돌려 결과를 보기까지 막히지 않아야 한다.
  - 데모 한 장면: "기존 테스트 그대로, 이런 접근 기록이 나온다"를 보여주는 리포트 화면이 제품 설명을 대신한다.
  - Playwright 버전 호환성: 가로채기가 Playwright 비공개 API에 기대므로([[Playwright 가로채기:내부 API 의존]]) 지원 버전 범위를 명시하고 버전별로 감시해야 한다.
  - 기록 형식은 공개 계약: 다른 사람이 JSON 기록 위에 도구를 만들기 시작하면 바꾸기 어렵다.

  저장소는 패키지 하나로 구성한다. 2026-11 결정이다.
  ```text
  src/        패키지 코드
  test/       검증 페이지와 자체 테스트(시나리오별 폴더)
  examples/   README의 시작 안내와 데모 리포트용 예제
  .codocs/    설계 문서
  ```
  Playwright 전용 플러그인(playwright-bdd, monocart-reporter, playwright-lighthouse, guidepup-playwright 등)은 모두 이 형태였고, 모노레포는 axe-core-npm, allure-js, argos처럼 여러 테스트 도구를 함께 지원하는 제품에서만 쓰였다. 이 도구는 Playwright 외 프레임워크를 지원하지 않으므로 패키지 하나가 맞다. 나중에 스크린 리더를 붙일 때는 guidepup처럼 별도 패키지로 나눈다.
  도구는 pnpm, TypeScript를 쓰고 자체 테스트도 Playwright Test로 돌린다. CI는 GitHub Actions에서 지원 하한과 최신 Playwright로 돌린다([[Playwright 가로채기:지원 버전]]).
버전 1 범위: |
  버전 1은 작게 구현하고, 실제 서비스에서 써 본 뒤 고도화한다. 2026-11 결정이다.

  포함:
  - 도입: 설정 파일 하나, `A11Y=1`일 때만 실행([[Playwright 가로채기:도입 방식]]).
  - 도달: `click`, `fill`, `check`, `press`의 목표를 Tab으로 찾고, 목표가 든 복합 위젯 안에서는 방향키를 쓴다. 도달 기준과 종료 조건을 따른다([[키보드 모드:탐색 경로]], [[키보드 모드:도달 기준]], [[키보드 모드:탐색 종료]]).
  - 실행: 도달한 요소에서 키로 실행하고 다음 줄이 통과하는지 본다. `dblclick`, `hover`, 우클릭처럼 키가 정해지지 않은 동작은 후보 키를 시도하고, 틀리면 재시도로 다시 실행한다([[키보드 모드:독립 실행]], [[키보드 모드:재실행 방식]]).
  - 전달되는 정보: Tab 지점마다 역할, 이름, 이름 출처, 상태, 랜드마크, 가까운 제목.
  - 흐름: 단계 시작 포커스와 지나간 지점 순서.
  - Playwright: `>=1.54 <2`를 지원한다([[Playwright 가로채기:지원 버전]]).
  - 브라우저: Chromium만 지원한다. 역할·이름·상태를 CDP로 읽는데 CDP는 Chromium에만 있기 때문이다. 접근성 실행은 사용자 프로젝트의 설정(주소, 화면 크기, 로그인 상태 등)을 가져다 쓰고 브라우저만 Chromium으로 정한다. 리포트와 문서에 Chromium 기준 기록임을 밝힌다.
  - 결과: 진행하지 못하면 그 단계에서 실패로 끝내고, 리포트 단계 요약, 사실 조건 지점의 이미지, trace, `a11y-results.json`을 남긴다.

  고도화로 미룸:
  - 포커스 표시 자동 판단([[기록과 리포트:포커스 표시 관찰]])
  - 건너뛰기 링크 동작 확인. 버전 1은 Tab 경로에 링크가 있다는 사실만 남긴다([[키보드 모드:건너뛰기 링크]]).
  - 사용자 정의 기준, `aria-describedby` 문장에서 키 읽기, 드래그 대체 수단
  - Firefox·WebKit. 브라우저마다 Tab 동작이 달라(예: Safari는 설정에 따라 Tab이 링크를 건너뜀) 키보드 동작 차이부터 다시 본다.
  - 스크린 리더
제외 범위: |
  초기에는 다음을 다루지 않는다.
  - 자체 AI 모델, AI 에이전트, AI가 웹사이트를 임의로 탐색하는 기능
  - 색 대비 등 정적 WCAG 규칙 전체 검사. 이 영역은 axe-core 같은 기존 도구가 잘 해결하며, 규칙 검사와 여정 관찰은 상호보완 관계로 둔다.
  - 코드 자동 수정
  - 실제 스크린 리더 동작의 완전한 재현
  - Playwright 외 E2E 프레임워크 지원
  - 접근성 점수나 문제 여부의 자동 판정 ([[관찰과 판단의 분리]])
문서 안내: |
  - [[문제 정의]]: 누구의 어떤 문제를 왜 푸는가, 그 문제 정의가 기대는 가정은 무엇인가.
  - [[관찰과 판단의 분리]]: 도구가 무엇을 기록하고 무엇을 판단하지 않는가, 관찰 범위와 테스트 성공·실패는 무엇을 따르는가.
  - [[기록과 리포트]]: 기록을 어떻게 전달하고 Playwright 리포트에 어떻게 보여 주는가.
  - [[접근 모드]]: 어떤 접근 방식으로 E2E를 다시 실행하는가, 모드 사이의 관계와 첫 버전 범위는 무엇인가.
  - [[Playwright 가로채기]]: 기존 테스트를 고치지 않고 동작을 바꿔 실행하는 메커니즘은 무엇이며 어디까지 확인됐는가.
  - [[테스트베드]]: 도구를 무엇으로 검증하는가.
  - [[선행 사례]]: 비슷한 도구는 무엇이 있고 무엇이 다른가.
  - [[열린 질문]]: 아직 정하지 않은 설계 결정은 무엇인가.
