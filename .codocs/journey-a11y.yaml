_codocs:
  id: journey-a11y
  name: Journey A11y
개요: |
  Journey A11y(가칭)는 이미 작성된 Playwright E2E 테스트를 키보드로 다시 실행하는 오픈소스 개발자 도구다.
  이 문서는 도구의 목표와 원칙, 무엇을 어떻게 검사하는지를 정한다. 기능이나 범위를 판단할 때 이 문서의 목표에 필요한지를 기준으로 삼는다.

  목표: 기존 Playwright E2E 테스트를 고치지 않고, 동작 줄만 키보드로 바꿔 실행해서, 그 여정을 키보드로 끝까지 할 수 있는지 검사한다.

  2026-11에 평범한 E2E 여섯 개(로그인, 검색해서 장바구니 담기, 확인 창이 뜨는 삭제, 주문 폼, 직접 만든 드롭다운, 드래그와 hover가 있는 보드)를 놓고 케이스마다 무엇을 어떻게 볼지 정해서 이 목표와 아래 규칙을 얻었다.
배포 형태: |
  오픈소스 Playwright 확장 패키지로 시작한다. 별도 웹서비스나 브라우저 확장 프로그램보다 진입 장벽이 낮고, 기존 E2E 테스트와 CI에 자연스럽게 들어가기 때문이다.
  패키지 이름은 `journey-a11y`다. 2026-11 결정이다. 프로젝트 이름과 같고, "여정(journey)"이 페이지 검사가 아니라 E2E 흐름을 따라가는 검사라는 차이를 드러낸다. `playwright-a11y`도 검토했으나 axe 계열 검사기와 구분되지 않는다. npm 검색은 `keywords`의 `playwright`, `accessibility`로 잡는다.

  오픈소스가 목표이므로 다음이 요구 사항이 된다.
  - 처음 5분 경험: 설치하고 기존 E2E 하나를 돌려 결과를 보기까지 막히지 않아야 한다.
  - Playwright 버전 호환성: 가로채기가 Playwright 비공개 API에 기대므로([[Playwright 가로채기:내부 API 의존]]) 지원 버전 범위를 명시하고 버전별로 감시해야 한다.

  저장소는 패키지 하나로 구성한다. 2026-11 결정이다.
  ```text
  src/        패키지 코드
  test/       검증 페이지와 자체 테스트(시나리오별 폴더)
  examples/   README의 시작 안내와 데모용 예제
  .codocs/    설계 문서
  ```
  Playwright 전용 플러그인(playwright-bdd, monocart-reporter, playwright-lighthouse, guidepup-playwright 등)은 모두 이 형태였고, 모노레포는 axe-core-npm, allure-js, argos처럼 여러 테스트 도구를 함께 지원하는 제품에서만 쓰였다. 이 도구는 Playwright 외 프레임워크를 지원하지 않으므로 패키지 하나가 맞다.
  도구는 pnpm, TypeScript를 쓰고 자체 테스트도 Playwright Test로 돌린다. CI는 GitHub Actions에서 지원 하한과 최신 Playwright로 돌린다([[Playwright 가로채기:지원 버전]]).
제외 범위: |
  - 색 대비 등 정적 WCAG 규칙 검사: axe-core 같은 기존 도구가 다루는 영역이며 이 도구와는 상호보완 관계로 둔다.
  - [[Journey A11y:검사하는 것]]에서 보지 않기로 한 Tab 순서, 포커스 표시, 이름 전달
  - 테스트의 동작을 바꿔야 쓸 수 있는 기능
  - Playwright 외 E2E 프레임워크 지원
문서 안내: |
  - [[Playwright 가로채기]]: 기존 테스트를 고치지 않고 동작을 바꿔 실행하는 메커니즘은 무엇이며 어디까지 확인됐는가.
  - [[테스트베드]]: 도구를 무엇으로 검증하는가.
  - [[테스트 작성 규칙]]: 실사용 케이스와 구현 시나리오를 어떻게 두고 진행하는가.
  - [[코드 작성 규칙]]: 코드와 커밋을 어떤 규칙으로 쓰고 어떤 도구로 강제하는가.
  - [[선행 사례]]: 비슷한 도구는 무엇이 있고 무엇이 다른가.
원칙: |
  - 테스트의 동작을 고치지 않는다: 접근성 검사를 위해 기존 E2E에 코드를 더하게 하지 않는다. 도구가 실행할 대안 단계를 개발자가 테스트에 적어 주는 안은 이 원칙 때문에 받지 않았다. 테스트의 동작을 바꾸지 않는 주석 한 줄([[Journey A11y:대안 테스트]])과 설정([[Journey A11y:실행할 수 없는 동작]])은 받는다. 2026-11에 이 범위로 좁혔다.
  - 추측하지 않는다: 브라우저와 W3C 안내서가 정해 둔 키만 쓴다. 키가 먹히지 않을 때 다른 키를 시도하지 않고, 표시가 없는 요소의 종류를 짐작하지 않는다.
  - 판단은 원래 테스트가 한다: 키보드로 실행한 뒤 다음 줄과 `expect`가 통과하는지가 결과다. 도구가 따로 기준을 만들지 않는다.
  - 모르는 것은 모른다고 한다: 도구가 확인하지 못한 줄을 통과로 적지 않는다. 키보드로 실행할 방법이 없는 줄은 기본으로 실패시키고, 설정으로 넘기더라도 "검사하지 못함"으로 남긴다.
검사하는 것: |
  세 가지만 본다. 셋 다 테스트 코드만으로 답이 정해진다.
  - 닿는가: 테스트가 가리킨 요소에 키보드로 갈 수 있는가. 기준은 [[Journey A11y:도달]]에 있다.
  - 실행되는가: 닿은 곳에서 키보드로 입력하고 누를 수 있는가. 누르는 키는 [[Journey A11y:실행 키]]에 있다.
  - 결과가 같은가: 키보드로 해도 원래 테스트가 기대한 결과가 나오는가. 판단 방법은 [[Journey A11y:결과]]에 있다.

  다음은 보지 않는다. 테스트 코드에 기준이 없어 도구가 임의로 정해야 하기 때문이다.
  - Tab 순서가 자연스러운가
  - 포커스가 눈에 보이는가
  - 이름이 전달되는가
도달: |
  정답 요소: 테스트가 가리킨 목표에서 시작해 자기 자신, 부모, 그 부모 순으로 올라가다 처음 만난 포커스 가능한 요소다. 포커스 가능한지는 태그와 속성으로 안다(`<button>`, `<a href>`, `<input>`, `<select>`, `tabindex`가 있는 요소 등). Tab을 누르기 전에 페이지 구조만으로 구한다.
  - `<button><span>장바구니 담기</span></button>`에서 테스트가 `<span>`을 가리켰다면 정답은 `<button>`이다. 버튼 안의 글자는 버튼의 일부라서 글자를 누르는 것이 곧 버튼을 누르는 것이다.
  - 포커스 가능한 카드 안에 버튼이 있고 목표가 그 버튼이면 정답은 버튼이다. 카드에 포커스가 와도 지나친다.

  닿았다: Tab을 누를 때마다 지금 포커스된 요소가 정답 요소와 같은지 비교하고, 같으면 닿은 것이다.

  닿을 수 없음: 다음 둘 중 하나다. 실패 메시지에 이유를 적는다.
  - 끝까지 올라가도 포커스 가능한 요소가 없다. 예: `<div onclick>`.
  - 정답 요소는 있는데 Tab으로 거기에 오지 않는다. 예: `tabindex="-1"` 버튼.

  목표의 안쪽은 찾지 않는다. `<div class="product-card"><a>…</a></div>`에서 테스트가 `div`를 가리켰다면 안에 링크가 있어도 닿을 수 없음이다. 조작 가능한 요소는 자기 안쪽은 품지만 바깥쪽은 품지 않으므로, 이 경우는 테스트가 조작할 수 없는 요소를 가리킨 것으로 본다. 메시지에 "목표가 포커스를 받을 수 없는 요소"라고 적어 개발자가 사이트와 테스트 중 무엇을 고칠지 정하게 한다.

  Tab의 범위: 직전 단계가 끝났을 때 포커스가 있는 곳에서 이어서 누른다. 이미 지나간 요소에 다시 오면 한 바퀴 돈 것으로 보고, 그때까지 정답 요소가 나오지 않으면 닿을 수 없음이다. 시작한 요소로 돌아왔는지로 판단하지 않는 이유는, 시작 요소가 사라지거나 포커스가 확인 창 안에 갇히면 돌아오지 못하기 때문이다. 2026-11 실측(Playwright 1.65.0, 헤드리스 Chromium)에서 Tab은 마지막 요소 다음에 페이지 바깥을 한 번 거쳐 첫 요소로 돌아왔다. 날짜 입력란처럼 Tab을 눌러도 포커스가 같은 요소 안에 머무는 경우는 다시 온 것으로 치지 않는다(2026-11 실측: Chromium의 날짜 입력란은 Tab 네 번에 벗어났다). Tab 횟수 상한은 두지 않는다. 누를 때마다 새 요소가 생기는 페이지는 테스트 시간 제한으로 끝난다. Tab을 많이 눌러야 닿는 경우도 통과이며 누른 횟수는 숫자로만 남긴다.

  기다림: 동작할 차례에 목표가 아직 화면에 없거나 꺼져 있으면(`disabled`) 원래 Playwright 동작이 기다리는 만큼 기다린 뒤 도달을 시작한다. Tab은 기다림이 끝난 뒤부터 센다. 더 짧게 기다리면 느린 페이지에서 마우스로는 통과하는 테스트가 키보드와 상관없는 이유로 실패하기 때문이다. 끝내 나타나지 않으면 Playwright의 시간 초과로 실패하고, 첨부에는 목표가 화면에 나타나지 않았다고 남긴다.

  방향키로 다니는 묶음: 목표가 라디오 묶음이나 HTML에 `listbox`, `menu`, `tablist` 등으로 표시된 묶음의 항목이면, Tab으로 그 묶음에 들어간 뒤 방향키로 목표까지 간다. 이런 묶음은 Tab 한 칸으로 취급되어 Tab만으로는 항목에 닿지 않기 때문이다.
  - 방향키로 묶음을 한 바퀴 돌아도 목표가 나오지 않으면 닿을 수 없음이다.
  - 포커스가 목표 항목에 직접 오거나, 포커스된 요소가 `aria-activedescendant`로 목표 항목을 가리키면 닿은 것이다.
  - 포커스된 요소가 `aria-controls`로 목표가 든 묶음을 가리키면 그 묶음 안에 있는 것으로 보고 Tab 없이 방향키로 간다. 자동완성처럼 포커스가 입력란에 남은 채 목록을 조종하는 표준 방식이며, 여기서 Tab을 누르면 포커스가 입력란을 떠나 목록이 닫힌다. 2026-11 결정이다.
  - 묶음 표시가 없으면 추측하지 않는다. 표시가 없고 Tab으로도 닿지 않으면 닿을 수 없음이다.
실행 키: |
  기본 요소는 브라우저가 요소 종류별로 정해 둔 키를 쓴다.
  - 버튼, 링크: Enter
  - 체크박스: Space
  - 입력란: 키를 누르지 않고 원래 `fill`로 값을 넣는다([[Journey A11y:동작별 처리]]).
  - 라디오: 방향키로 도착하면 이미 선택된 것이므로 따로 누르지 않는다.

  직접 만든 요소는 HTML에 표시된 종류(`role`)에 대해 W3C 안내서가 정한 키 하나만 누른다. 예: `role="button"`, `role="option"`, `role="menuitem"`은 Enter, `role="checkbox"`는 Space.
  그 키에 반응이 없으면 다른 키를 시도하지 않는다. 다음 줄이 실패하고, 메시지에 어떤 종류의 요소에서 어떤 키를 눌렀는지 적는다. 다른 키를 시도하려면 다음 줄이 실패할 때까지 기다린 뒤 처음부터 다시 실행해야 하고, 표시한 종류의 키에 반응하지 않는 것 자체가 키보드 사용자가 예상대로 쓸 수 없는 상태이기 때문이다.
동작별 처리: |
  | 테스트의 동작 | 키보드로 하는 일 | 실패가 되는 경우 |
  |---|---|---|
  | `click` (버튼, 링크) | Tab으로 닿고 Enter | 닿을 수 없음 |
  | `fill` | Tab으로 닿는지만 확인하고 원래 줄을 그대로 실행 | 입력란에 닿을 수 없음 |
  | `check` (체크박스) | Tab으로 닿고 Space | 닿을 수 없음 |
  | `check` (라디오) | Tab으로 묶음에 들어가 방향키 | 방향키 한 바퀴에도 목표가 없음 |
  | `selectOption` | Tab으로 닿는지만 확인하고 원래 줄을 그대로 실행 | select에 닿을 수 없음 |
  | 직접 만든 목록·메뉴의 항목 `click` | 방향키로 목표까지 가서 정해진 키 하나 | 닿을 수 없음 |
  | `press` | 그대로 누름 | 없음 |
  | `hover` | 그 요소로 포커스를 옮김 | 없음 |
  | 오른쪽 버튼 `click` | Tab으로 닿고 Shift+F10 | 닿을 수 없음 |
  | `setInputFiles` | 파일 선택 창을 여는 요소에 Tab으로 닿고 Enter, 열린 창에 파일을 넣음 | 여는 요소가 없음, 닿을 수 없음, Enter에 창이 열리지 않음 |
  | `dblclick`, 요소에 `aria-keyshortcuts` 있음 | Tab으로 닿고 거기 적힌 키 | 닿을 수 없음 |
  | `dragTo`, 키 표시 없는 `dblclick`, `tap`, 가운데 버튼 `click` | 실행하지 않음 | 그 줄에서 실패([[Journey A11y:실행할 수 없는 동작]]) |
  | `expect` | 그대로 실행 | 원래 `expect`가 실패 |

  - `fill`: Playwright의 이 명령은 원래도 키를 하나씩 누르지 않고 기존 값을 새 값으로 바꾼다. 도구가 따로 글자를 치면 날짜 입력란이나 직접 만든 편집기에서 원래와 결과가 어긋날 수 있다. 2026-11 실측에서 Tab으로 들어간 `<input>`은 기존 글자가 선택되어 바뀌었지만 `<textarea>`와 `contenteditable`은 새 글자가 앞에 붙었다. 입력란에 닿기만 하면 그 안에서 지우고 다시 쓰는 것은 사용자가 할 수 있으므로 "입력란에 닿는가"만 확인한다. 날짜·시간, 색 선택, 편집기, 값이 있는 입력란이 모두 이 방식으로 처리된다. 2026-11 결정이다.
  - `selectOption`: Playwright의 이 명령은 원래도 목록을 열어 누르지 않고 값을 바로 바꾼다. 기본 `<select>` 안에서 항목을 고르는 동작은 브라우저가 처리하고 키 동작이 운영체제마다 달라, 사이트가 잘못 만들 수 있는 부분인 "select에 닿는가"만 확인한다. 이 명령은 기본 `<select>`에서만 동작하므로 직접 만든 드롭다운은 `click` 줄로 적히고 위 표의 `click` 규칙을 따른다.
  - `hover`: 마우스를 올렸을 때 나타나는 것은 포커스가 갔을 때도 나타나야 하므로 포커스 이동으로 대신한다. 그 요소가 포커스를 받을 수 없으면 아무것도 하지 않고 넘어간다. hover는 다음 동작의 준비이므로 이 줄에서 실패시키지 않고 다음 줄이 판단하게 한다.
  - 오른쪽 버튼 `click`: 컨텍스트 메뉴를 여는 키는 W3C 안내서(APG)의 키 표가 Shift+F10으로 정해 두었다. 2026-11 실측(헤드리스 Chromium)에서 Shift+F10은 포커스된 요소에 `contextmenu` 이벤트 하나만 일으켰고 좌표는 요소 한가운데였다. 마우스 우클릭이 함께 일으키는 `mousedown`, `mouseup`, `auxclick`은 나지 않으므로, 이 이벤트로만 메뉴를 여는 사이트는 다음 줄에서 실패한다. 2026-11 결정이다.
  - `setInputFiles`: 파일 선택 창을 여는 요소에 Tab으로 닿고 Enter를 눌러, 열린 창에 Playwright가 파일을 넣는다. 창 안에서 파일을 고르는 화면은 운영체제의 것이라 사이트가 잘못 만들 수 없으므로 창이 열리는 데까지만 키보드로 확인한다. 2026-11 결정이다.
    - 여는 요소: 입력란이 화면에 보이면 입력란 자신이다. 보이지 않으면 HTML이 그 입력란에 연결한 `label`(`for` 또는 감싸기) 중 화면에 보이는 것이다. 이 연결은 HTML에 적혀 있어 추측이 아니다.
    - 여는 요소가 없으면 실패다. 숨긴 입력란을 스크립트로만 여는 버튼은 HTML에 단서가 없어 찾지 못한다. 이 경우 테스트가 사용자가 누르는 요소를 거치지 않고 숨긴 입력란에 파일을 바로 넣은 것이므로, 링크가 든 `div`를 가리킨 테스트([[Journey A11y:도달]])와 같은 기준으로 실패시키고 메시지에서 파일 선택 창을 여는 요소를 `click`하도록 쓰라고 안내한다. 사용자가 E2E 관점에서도 버튼을 누르지 않는 테스트는 좋지 않다고 보아 정했다. Playwright 문서가 안내하는 흔한 방식이라 실제 서비스에서 이 실패가 자주 나올 수 있다.
    - `label`은 마우스로 누르면 입력란을 열지만 키에는 스스로 반응하지 않는다. 2026-11 실측에서 `tabindex="0"`인 `label`은 Enter와 Space 모두 창을 열지 않았고, 사이트가 키 처리를 붙이면 열렸다. `tabindex`가 없는 `label`은 닿을 수 없음이다.
    - 테스트가 `waitForEvent('filechooser')` 뒤에 여는 버튼을 `click`하는 방식이면 그 `click` 줄이 키보드로 실행되고, 창이 열리지 않으면 원래 테스트의 기다림이 실패한다.
    - Enter 뒤 창을 기다리는 시간은 2초다. 브라우저는 키를 처리하는 동안 창을 열기 때문이다.
  - `dblclick`: 더블클릭에 대응하는 키는 브라우저도 W3C 안내서도 정하지 않았다. 2026-11 실측에서 버튼의 Enter 두 번은 `click` 두 번이었고 `dblclick`은 나지 않았다. 그래서 사이트가 요소에 `aria-keyshortcuts`로 키를 적어 둔 경우에만 그 키를 누른다. 목표나 목표를 감싼 요소 중 가장 가까운 것의 값을 읽고, 여러 개면 첫 번째를 쓴다. 이 속성은 그 요소를 실행하는 키라고만 말하므로, 더블클릭과 결과가 같은지는 다음 줄과 `expect`가 가린다. 2026-11 결정이다.
  - `dragTo`: 키보드 대안이 필요한 동작이지만 대안의 모양은 지침이 정하지 않아 사이트마다 다르다(옆의 버튼, 메뉴, 별도 대화 상자). 테스트 코드와 표준 ARIA 속성 어디에도 단서가 없어 도구가 실행하지 못한다.
실행할 수 없는 동작: |
  키보드로 바꿔 실행할 방법이 없는 동작(`dragTo`, 키 표시 없는 `dblclick`, `tap`, 가운데 버튼 `click`)은 그 줄에서 실패시킨다. 2026-11 결정이다. 한 줄이 비면 그 테스트는 키보드로 끝까지 이어진 여정이 아니므로 통과로 둘 수 없고, 개발자에게는 [[Journey A11y:대안 테스트]]로 답할 방법이 있기 때문이다. 메시지에 대안 테스트 주석을 다는 법을 적는다.
  ```text
  Error: 키보드로 실행할 수 없는 동작입니다: dragTo
  같은 일을 키보드로 하는 테스트가 있다면 이 테스트 위에 "// a11y-alternative: <그 테스트의 제목>"을 적어 주세요.
  ```

  설정으로 넘길 수 있다. `withA11y(설정, { unsupportedActions: 'pass' })`로 두면 그런 줄을 원래 방식으로 실행하고 테스트를 이어 가며, 첨부와 터미널에 "검사하지 못함"으로 남긴다. 이 부분을 검사하고 싶지 않은 팀을 위한 것이다. 말없이 지나가면 테스트 전체가 키보드로 검사된 것처럼 보이므로 기록은 남긴다. 설정은 프로젝트 전체에 적용되고, 테스트 하나만 넘기려면 대안 테스트 주석을 쓴다.

  처음에는 이런 줄을 모두 "검사하지 못함"으로 두고 통과시켰다. 2026-11에 대안 테스트 주석이 생기면서 기본을 실패로 바꿨다.
대안 테스트: |
  테스트 바로 위에 `// a11y-alternative: <다른 테스트의 제목>` 주석을 달면, 그 테스트는 키보드 실행에서 건너뛰고 가리킨 테스트가 대신한다. 2026-11 결정이다.
  ```ts
  // a11y-alternative: 버튼으로 카드를 완료로 옮긴다
  test('카드를 끌어 완료로 옮긴다', async ({ page }) => { ... });

  test('버튼으로 카드를 완료로 옮긴다', async ({ page }) => { ... });
  ```
  - 쓰는 경우: 드래그처럼 키보드로 실행할 수 없는 동작이 있지만, 같은 일을 키보드로 할 수 있는 다른 길(버튼, 메뉴)이 있고 그 길을 도는 테스트가 있을 때다. 대안이 무엇인지는 사이트마다 달라 도구가 찾을 수 없으므로 개발자가 알려 준다.
  - 건너뛴 테스트는 Playwright의 건너뜀으로 표시하고 이유에 "대안 테스트로 대체: <제목>"을 적는다. 새 결과 종류를 만들지 않는다. 마우스 실행에서는 주석과 상관없이 그대로 돈다.
  - 줄 하나가 아니라 테스트 전체를 넘긴다. 한 줄을 다른 테스트로 넘기면 그 테스트는 이미 끝까지 이어진 여정이 아니어서 나머지 줄을 키보드로 실행해도 의미가 없기 때문이다. 그 테스트에만 있는 다른 줄이 검사에서 빠지는지는 개발자가 책임진다.
  - 대안 테스트의 결과를 기다리지 않는다. 대안 테스트는 같은 실행 안에서 스스로 키보드로 돌고, 실패하면 전체 실행이 실패한다. 테스트끼리 서로의 결과를 실행 중에 알 수 없다.
  - 가리킨 제목의 테스트가 없으면 그 테스트를 실패시킨다. 조용히 건너뛰면 대안 테스트가 지워지거나 이름이 바뀌어도 계속 대체된 것으로 남기 때문이다. 도구는 프로젝트의 테스트 폴더에 있는 파일에서 그 제목이 문자열로 적힌 곳을 찾는다. 제목을 변수로 조립한 테스트는 찾지 못하고, 그 테스트가 키보드 실행에서 빠져 있는지는 알지 못한다.
  - 접근성 검사를 건너뛰는 데 쓸 수 있지만 막지 않는다. 그런 개발자는 도구를 끄면 되기 때문이다.
결과: |
  줄마다 결과는 통과, 실패, 검사하지 못함 셋 중 하나다. 검사하지 못함은 [[Journey A11y:실행할 수 없는 동작]]의 설정을 켰을 때만 나온다.

  도구가 바꾸는 것은 동작 줄을 실행하는 방법뿐이다. `expect` 줄은 손대지 않고 Playwright가 평소처럼 실행한다. 키보드 실행이 제대로 되지 않았다면 이어지는 `expect`나 다음 동작 줄이 실패하고, Playwright가 평소처럼 테스트를 실패로 표시한다.

  전제: 원래 테스트가 마우스로는 통과한다. 마우스로 통과하는 테스트가 키보드로 실행했을 때만 실패해야 그 차이를 키보드 때문이라고 말할 수 있다.

  결과는 모두 Playwright 안에 남기고 따로 결과 파일이나 화면을 만들지 않는다. 2026-11 결정이다. 개발자가 새로 배울 것이 없고 CI도 평소처럼 동작하기 때문이다. 프로그램으로 읽으려면 Playwright가 제공하는 JSON 리포트를 쓴다.

  - 닿을 수 없음: 그 동작 줄에서 오류를 던져 평소 Playwright 실패로 보인다. 메시지에 목표, 이유, 누른 Tab 횟수를 적는다.
    ```text
    Error: 키보드로 닿을 수 없습니다: getByText('로그인')
    목표 <div class="login-btn">은 포커스를 받을 수 없는 요소입니다.
    Tab을 한 바퀴(14번) 눌렀습니다.
    ```
  - 줄별 요약: 테스트마다 "키보드 실행"이라는 글자 첨부(`text/plain`) 하나를 붙인다. 동작 줄마다 줄 번호, 동작, 결과, 한 일(Tab과 방향키 횟수, 누른 키와 그 요소)을 한 줄로 적는다. 키에 반응이 없어 다음 줄의 `expect`가 실패했을 때, 직전에 키보드로 무엇을 했는지를 여기서 안다. 요소의 종류와 이름은 Playwright의 공개 기능(`locator.ariaSnapshot()`)으로 읽는다. 공개 기능이라 버전이 올라도 깨질 가능성이 낮고 브라우저를 가리지 않는다. 2026-11 실측에서 요소 10개의 값이 Chromium 접근성 트리에서 읽은 값과 같았다.
    ```text
    4행 fill   통과  Tab 1번, 글자 입력
    5행 fill   통과  Tab 1번, 글자 입력
    6행 click  통과  Tab 1번, button "로그인"에서 Enter
    ```
    Playwright는 실패한 테스트의 글자 첨부를 터미널에 그대로 출력하고, HTML 리포트에서는 통과한 테스트의 첨부도 볼 수 있다. 2026-11 list 리포터로 실측했고, 같은 실측에서 단계 이름과 annotation은 터미널에 나오지 않았다.
  - 검사하지 못함: 첨부에 남기고, 터미널에도 그 줄을 한 줄로 알린다. 통과한 테스트의 첨부는 터미널에 나오지 않아, 알리지 않으면 전부 키보드로 된다고 오해하기 쉽기 때문이다. 통과한 줄은 터미널에 출력하지 않는다.
    ```text
    [journey-a11y] board.spec.ts:4 dragTo — 키보드로 검사하지 못했습니다
    ```

  위 예시는 담기는 내용을 보이기 위한 것이며 정확한 문구는 구현하며 정한다.
정하지 않은 것: |
  - 드래그를 키보드로 직접 실행하는 방법: 2026-11 실측에서 dnd-kit은 요소에 `aria-roledescription`을 붙이고 Space, 방향키, Space로 옮길 수 있었다. 이런 라이브러리 표시가 있을 때만 실행하는 안은 대안 테스트 주석으로 대부분 풀려 넣지 않았다.
  - `modifiers`, `clickCount`, `position` 옵션이 붙은 `click`은 알림 없이 Enter 한 번으로 실행된다.
  - 우클릭의 Shift+F10은 APG 키 표에서 macOS 칸이 비어 있고, macOS에서 실측하지 않았다.
  - 좌표로 누르기(`page.mouse`)는 아직 가로채지 않아, 알림 없이 원래 방식으로 실행된다.
  - iframe과 shadow DOM 안의 목표는 아직 논의하지 않았다. `aria-keyshortcuts`는 `dblclick`에만 쓰고 다른 동작에서는 읽지 않는다.
  - 케이스가 없어 확인하지 못한 것: `testIdAttribute`를 바꾼 프로젝트, 끝내 켜지지 않는 목표의 시간 초과, 모달 안에 갇히는 경우, SPA 이동 뒤 포커스가 사라지는 경우.
