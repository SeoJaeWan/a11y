name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *' # 03:00 KST
  workflow_dispatch:
    inputs:
      playwright:
        description: 'Playwright version to run scenarios with (empty: every supported minor and beta)'
        required: false
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: 변경 확인
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ] && [ "$EVENT" != "push" ]; then
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$BASE" "$HEAD" || echo "unknown")
          echo "$files"
          code=$(echo "$files" | grep -vE '^\.codocs/|\.md$' || true)
          if [ -n "$files" ] && [ -z "$code" ]; then
            echo "docs-only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs-only=false" >> "$GITHUB_OUTPUT"
          fi

  branch-name:
    name: 브랜치 이름
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          BRANCH: ${{ github.head_ref }}
        run: pnpm exec validate-branch-name -t "$BRANCH"

  static:
    name: 정적 검사
    needs: changes
    runs-on: ubuntu-latest
    env:
      SKIP: ${{ needs.changes.outputs.docs-only == 'true' }}
    steps:
      - if: env.SKIP == 'true'
        run: echo "문서만 바뀌어 검사할 것 없음"
      - if: env.SKIP != 'true'
        uses: actions/checkout@v7
      - if: env.SKIP != 'true'
        uses: pnpm/action-setup@v6
      - if: env.SKIP != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - if: env.SKIP != 'true'
        run: pnpm install --frozen-lockfile
      - if: env.SKIP != 'true'
        run: pnpm lint
      - if: env.SKIP != 'true'
        run: pnpm format:check
      - if: env.SKIP != 'true'
        run: pnpm typecheck
      - if: env.SKIP != 'true'
        run: pnpm test
      - if: env.SKIP != 'true'
        run: pnpm lint:package
      - if: env.SKIP != 'true'
        run: pnpm knip

  versions:
    name: 버전 목록
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: list
        env:
          PLAYWRIGHT_VERSION: ${{ github.event.inputs.playwright }}
        run: node scripts/playwright-versions.ts

  scenarios:
    name: 시나리오 (${{ matrix.label }})
    needs: versions
    # Playwright 1.60 and older ship no Chromium for Ubuntu 26.04 (ubuntu-latest since 2026).
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.isBeta }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: ${{ !matrix.isPinned }}
        run: pnpm add -D @playwright/test@${{ matrix.version }}
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm test:scenarios
      - if: always()
        env:
          SCENARIO_LABEL: ${{ matrix.label }}
        run: node scripts/scenario-summary.ts
      - name: 리포트 올리기 (실패)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-report-${{ matrix.version }}
          path: test/.report
          include-hidden-files: true
          retention-days: ${{ github.event_name == 'schedule' && 30 || 14 }}
      - name: 리포트 올리기 (고정 버전 통과)
        if: success() && matrix.isPinned
        uses: actions/upload-artifact@v7
        with:
          name: scenario-report-${{ matrix.version }}
          path: test/.report
          include-hidden-files: true
          retention-days: 7

  scenarios-windows:
    name: 시나리오 (Windows)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.docs-only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --only-shell chromium
      - run: pnpm test:scenarios
      - if: always()
        shell: bash
        env:
          SCENARIO_LABEL: Windows
        run: node scripts/scenario-summary.ts
      - name: 리포트 올리기 (실패)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: scenario-report-windows
          path: test/.report
          include-hidden-files: true
          retention-days: 14

  scenario-results:
    name: 시나리오 결과
    needs: [changes, versions, scenarios, scenarios-windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - env:
          DOCS_ONLY: ${{ needs.changes.outputs.docs-only }}
          VERSIONS: ${{ needs.versions.result }}
          SCENARIOS: ${{ needs.scenarios.result }}
          WINDOWS: ${{ needs.scenarios-windows.result }}
        run: |
          echo "versions=$VERSIONS scenarios=$SCENARIOS windows=$WINDOWS docs-only=$DOCS_ONLY"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "문서만 바뀌어 검사할 것 없음"
            exit 0
          fi
          # Beta legs use continue-on-error, so only released versions can fail this job.
          [ "$VERSIONS" = "success" ] || exit 1
          [ "$SCENARIOS" = "success" ] || exit 1
          case "$WINDOWS" in
            success | skipped) ;;
            *) exit 1 ;;
          esac

  scheduled-issue:
    name: 정기 실행 이슈
    needs: [scenarios]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          failed=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.name | startswith("시나리오 (")) | select(.conclusion == "failure") | .name')
          open=$(gh issue list --label ci-scheduled --state open --json number --jq '.[0].number // empty')
          if [ -n "$failed" ]; then
            versions=$(echo "$failed" | sed -E 's/^시나리오 \((.*)\)$/\1/' | paste -sd ',' - | sed 's/,/, /g')
            list=$(echo "$failed" | sed 's/^/- /')
            body=$(printf '실패한 Playwright 버전: %s\n\n%s\n\n실행: %s\n' "$versions" "$list" "$RUN_URL")
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh issue create --label ci-scheduled \
                --title "[정기 실행] Playwright $versions에서 시나리오 실패" --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue comment "$open" --body "다시 통과함: $RUN_URL"
            gh issue close "$open"
          fi
